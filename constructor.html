<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Constructor de calendarios — marcadorpr</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#12202E;--mute:#5A6B7C;--line:#D7E0E8;--tint:#F7FAFC;--accent:#0C6E8C;
      --ball:#FF7A18;--good:#0B7A5A;--bad:#A8323F}
*{box-sizing:border-box}
html{background:#12202E}
body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);
  background:#fff;line-height:1.5}
.wrap{width:min(860px,94vw);margin:0 auto}

header{flex:0 0 auto;background:#12202E;border-bottom:3px solid var(--ball);
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.mark{font-weight:900;font-size:1.05rem;color:#fff}
/* El botón de idioma, en la barra y pequeño: se usa una vez y no
   vuelve a tocarse. Va al lado del nombre para que se vea sin
   buscarlo — el que llega en inglés tiene que encontrarlo de una. */
.lang{font:inherit;font-weight:800;font-size:.78rem;cursor:pointer;
  border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  border-radius:999px;padding:6px 14px;white-space:nowrap}
.lang:hover{background:#fff;color:#12202E}
@media(max-width:520px){ header .sub{display:none} }
/* El selector de modo. Dos botones y no un desplegable: son dos
   caminos distintos, no una opción de uno. */
.modos{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
.modo{font:inherit;font-weight:800;font-size:.92rem;cursor:pointer;
  border:1px solid var(--line,#2a3744);background:transparent;color:inherit;
  border-radius:999px;padding:10px 18px}
.modo.on{background:var(--ball,#ff7a18);color:#111a24;border-color:transparent}
/* Una fila de juego de temporada.

   EN EL TELÉFONO CADA JUEGO ES UNA TARJETA, no una fila. A lo ancho
   se leen las seis casillas de corrido y se ve dónde acaba una y
   empieza la otra; en dos columnas, seis juegos seguidos son
   dieciocho casillas sin una sola costura, y la segunda «Contra
   quién» parece del primer juego. El número arriba y el borde
   alrededor son lo único que lo dice. */
.sjuego{display:grid;grid-template-columns:1.4fr 1fr .8fr 1fr .8fr .8fr auto;gap:8px;
  align-items:end;margin:0 0 10px}
.sjuego label{font-size:.72rem}
.sjn{display:none}
@media(max-width:760px){
  .sjuego{grid-template-columns:1fr 1fr;border:1px solid var(--line);
    border-radius:12px;padding:12px;margin:0 0 14px;background:var(--tint)}
  .sjn{display:block;grid-column:1/-1;margin:0 0 2px;
    font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mute)}
  /* El botón de quitar, a su tamaño y con su nombre. Una × sola en
     una caja ancha parecía una casilla más, vacía. */
  .sjuego .sborrar{grid-column:1/-1;justify-self:end;width:auto}
}
.sborrar{font:inherit;cursor:pointer;border:1px solid var(--line,#2a3744);
  background:transparent;color:var(--mute);border-radius:8px;padding:9px 12px;
  white-space:nowrap}
.sborrar:hover{color:var(--bad);border-color:var(--bad)}
.mark span{color:var(--ball)}
.sub{font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9FB3C4}

main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
main .wrap{padding:clamp(18px,4vw,28px) 0 40px}

h1{font-size:clamp(1.4rem,4vw,1.9rem);letter-spacing:-.03em;margin:0 0 6px;font-weight:900}
.lede{color:var(--mute);margin:0 0 22px;max-width:60ch}
h2{font-size:.7rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin:26px 0 10px}

label{display:block;font-size:.8rem;font-weight:700;margin:11px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:2px solid var(--ink);border-radius:4px;
  background:#fff;color:var(--ink);font:inherit;font-size:.98rem}
textarea{min-height:120px;resize:vertical;font-size:.92rem;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(12,110,140,.15)}
.row{display:grid;gap:12px}
.row.two{grid-template-columns:1fr 1fr}
.row.three{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.row.two,.row.three{grid-template-columns:1fr}}
.hint{font-size:.8rem;color:var(--mute);margin:4px 0 0}

.div{border:2px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:12px;position:relative}
.div h3{margin:0 0 4px;font-size:1rem;font-weight:900}
.div .x{position:absolute;top:8px;right:10px;border:none;background:none;color:var(--mute);
  font-size:1.4rem;line-height:1;cursor:pointer;padding:4px 8px}
.div .x:hover{color:var(--bad)}
.count{font-size:.78rem;color:var(--mute);margin-top:4px}

/* Una fila por cancha: el identificador a la izquierda, puesto por el
   constructor, y al lado el único campo que hay que escribir. */
.cr{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.cr .tag{font-weight:900;font-size:.92rem;text-align:center;padding:10px 0;border-radius:4px;
  background:var(--ink);color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* Las mismas filas para los equipos, con el número de siembra. Va más
   claro que la cancha: es un índice, no una etiqueta. */
.cr.t{grid-template-columns:34px 1fr;margin-bottom:6px}
.cr.t .tag{background:var(--tint);color:var(--mute);border:2px solid var(--line);
  padding:8px 0;font-size:.82rem}

/* En qué canchas puede jugar una categoría. No es un gusto: Mini
   juega en canastos de seis pies, y en una cancha reglamentaria no se
   puede jugar. Con una sola cancha no hay nada que escoger y la fila
   no sale. */
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pick{display:flex;align-items:center;gap:7px;margin:0;border:2px solid var(--line);
  border-radius:4px;padding:8px 12px;font-size:.84rem;font-weight:600;color:var(--mute);
  cursor:pointer}
.pick:has(input:checked){border-color:var(--accent);color:var(--ink)}
.pick input{width:17px;height:17px;flex:0 0 17px;margin:0;accent-color:var(--accent);
  cursor:pointer}
.pick b{font-weight:900;color:var(--ink)}

.btn{display:block;width:100%;padding:15px;border:2px solid var(--ink);border-radius:4px;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;
  margin-top:14px;text-align:center;text-decoration:none}
.btn.line{background:#fff;color:var(--ink)}
.btn.small{width:auto;padding:9px 16px;font-size:.88rem;margin-top:10px}

.out{border:2px solid var(--ink);border-radius:4px;padding:18px 20px;margin-top:22px;background:var(--tint)}
.out .big{font-size:2rem;font-weight:900;line-height:1}
.out .cap{font-size:.64rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.warn{border-left:4px solid var(--bad);background:#fff6f6;padding:12px 14px;margin:14px 0;font-size:.9rem}
.warn b{color:var(--bad)}

table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.86rem}
th{text-align:left;padding:7px 8px 7px 0;border-bottom:2px solid var(--ink);font-size:.6rem;
  font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute)}
.hat{display:inline-block;font-size:.58rem;font-weight:900;letter-spacing:.06em;
  color:var(--mute);vertical-align:.14em;margin-right:4px}

footer{flex:0 0 auto;background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.8rem}
footer b{color:#fff;display:block;font-weight:800}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <span class="mark">marcador<span>pr</span></span>
    <span class="sub" id="tSub">Constructor de calendarios</span>
    <button class="lang" id="btnLang" onclick="cambiarIdioma()">English</button>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 id="tituloModo">Monta un calendario</h1>
    <p class="lede" id="ledeModo"></p>

    <!-- ══════════════════════════════════════════════════════════
         DOS MANERAS DE LLENAR LA MISMA LISTA.

         Debajo, un torneo y una temporada son lo mismo: juegos con
         nombre, fecha, hora y cancha. El cuadro de un torneo los
         genera sembrando equipos por categoría; una temporada los
         escribe uno a uno. De ahí para abajo —registrar, enlazar,
         el enlace, la página— no cambia ni una línea.

         Hacía falta porque esto era un constructor de torneos y
         punto, y a un entrenador que quiere subir los seis juegos de
         su equipo se le pedía prefijo, categorías, siembras y rondas.
         Mucha herramienta para una lista.
         ══════════════════════════════════════════════════════════ -->
    <!-- ══════════════════════════════════════════════════════════
         EL DEPORTE, ENCIMA DEL MODO

         Son dos preguntas y no una: qué deporte, y si es un torneo o
         una lista de juegos. Las cuatro combinaciones existen, así
         que se preguntan por separado en vez de hacer cuatro
         pestañas que digan lo mismo dos veces.

         Y el deporte va primero porque es el que no cambia: un
         entrenador de voleibol lo escoge una vez y se olvida.

         POR DEBAJO SON EL MISMO TRATO. Se promete por punto y el
         marcador final salda la promesa. Un partido de voleibol a
         tres sets son sesenta o setenta puntos para un lado, que es
         el rango de un juego de baloncesto — los centavos por punto,
         el piso y la licencia no cambian ni una cifra. Lo que se
         promete es el TOTAL del partido y no los sets ganados: a
         tres sets, veinticinco centavos serían setenta y cinco, por
         debajo del piso, y todas las promesas cerrarían en cero.
         ══════════════════════════════════════════════════════════ -->
    <div class="modos">
      <button class="modo on" id="btnBalon" onclick="deporte('baloncesto')"
        data-i="depBalon">Baloncesto</button>
      <button class="modo" id="btnVoli" onclick="deporte('voleibol')"
        data-i="depVoli">Voleibol</button>
    </div>

    <div class="modos">
      <!-- Dos palabras y nada más. «La temporada de mi equipo» daba por
           hecho una temporada, y el que llega con cuatro juegos —o una
           liga con un fin de semana— no se ve ahí dentro. El verbo lo
           pone el título de abajo, que cambia con el modo. -->
      <button class="modo on" id="btnTorneo" onclick="modo('torneo')">Torneos</button>
      <button class="modo" id="btnTemporada" onclick="modo('temporada')">Juegos</button>
    </div>

    <!-- ── LA TEMPORADA DE UN EQUIPO ───────────────────────── -->
    <div id="paneTemporada" style="display:none">
      <h2 id="tTuEquipo"></h2>
      <div class="row two">
        <div><label id="tNombreEq"></label><input id="sTeam" autocapitalize="words"></div>
        <div><label id="tPuebloOp"></label><input id="sWhere" autocapitalize="words"></div>
      </div>
      <p class="hint" id="tIgual"></p>

      <h2 id="tTusJuegos"></h2>
      <div id="sJuegos"></div>
      <button class="btn line small" id="tAnadirJ" onclick="sAnadir()"></button>
      <p class="hint" id="tAnadeLos"></p>
      <p class="hint" id="tPadrinosJ"></p>

      <div class="row">
        <button class="btn" id="tHacerCal" onclick="construirTemporada()"></button>
      </div>
      <p class="hint" id="sMsg" style="font-weight:800;min-height:1.3em"></p>
    </div>

    <div id="paneTorneo">
    <h2 id="tElTorneo"></h2>
    <div class="row two">
      <div><label id="tLNombre"></label><input id="tName"></div>
      <div><label id="tLPueblo"></label><input id="tWhere"></div>
    </div>
    <div class="row two">
      <div><label id="tLPrimerDia"></label><input id="tFrom" type="date"></div>
      <div><label id="tLUltimoDia"></label><input id="tTo" type="date"></div>
    </div>
    <div class="row three">
      <div><label id="tLPrimeraH"></label>
        <select id="tStart"></select></div>
      <div><label id="tLUltimaH"></label>
        <select id="tEnd"></select></div>
      <div><label id="tLCasa"></label>
        <input id="tHome"></div>
    </div>
    <p class="hint" id="tHintCasa"></p>

    <label id="tLCanchas"></label>
    <select id="tCourtN" onchange="drawCourts()" style="max-width:120px"></select>
    <div id="courtRows" style="margin-top:14px"></div>
    <p class="hint" id="tHintCanchas"></p>

    <h2 id="tCategorias"></h2>
    <div id="divs"></div>
    <button class="btn line small" id="tAnadirCat" onclick="addDiv()"></button>

    <button class="btn" id="tGenerar" onclick="generate()"></button>
    </div><!-- /paneTorneo -->

    <div id="out"></div>
  </div>
</main>

<footer>
  <b>© 2026 Gostar Digital LLC · Puerto Rico</b>
  <span id="tPie">Constructor interno · marcadorpr</span>
</footer>

<script>
// ══════════════════════════════════════════════════════════════
//  El motor del calendario.
//
//  Entra: divisiones con sus equipos, canchas, días y horas.
//  Sale: cada juego numerado, con su ronda, y atado al juego del
//  que sale cada contrincante — que es lo que hace que el cuadro
//  se llene solo cuando entran los marcadores.
// ══════════════════════════════════════════════════════════════

// ── Eliminación directa ──────────────────────────────────────
// Un cuadro de 16 con 12 equipos no son cuatro rondas de todos:
// los cuatro primeros pasan directo. Los byes van arriba, que es
// como se siembra un cuadro.
// El orden del cuadro: 1 contra el último, 2 contra el penúltimo, y
// así hacia dentro. Se arma doblando — [1,2] → [1,4,3,2] → [1,8,5,4,
// 3,6,7,2] — que es el orden en que se siembra un bracket de verdad.
//
// Lo que esto arregla: antes los byes se ponían seguidos arriba, así
// que en un cuadro de 16 con 12 equipos los sembrados 1 y 2 caían en
// la misma mitad y se eliminaban en cuartos. Con doce equipos eso
// dejaba fuera a dos de los cuatro mejores antes de las semifinales.
// Ahora el 1 entra por arriba y el 2 por abajo: sólo se pueden
// encontrar en la final, que es de lo que sirve sembrar.
function ordenSiembra(size){
  var o = [1];
  while (o.length < size){
    var n = o.length * 2, sig = [];
    for (var i = 0; i < o.length; i++){
      sig.push(o[i]);
      sig.push(n + 1 - o[i]);
    }
    o = sig;
  }
  return o;
}

function knockout(teams, prefix, startNo){
  var n = teams.length;
  if (n < 2) return { games: [], nextNo: startNo };

  var size = 1;
  while (size < n) size *= 2;
  var byes = size - n;

  var games = [], no = startNo;
  var orden = ordenSiembra(size);

  // Primera ronda, por parejas del cuadro. Una pareja donde al
  // sembrado le toca un hueco vacío no se juega: pasa directo.
  //
  // Las dos nunca pueden ser huecos: los dos números de una pareja
  // suman size+1, y size es siempre menor que 2n, así que al menos
  // uno de los dos es un equipo de verdad.
  var slots = [];          // lo que pasa a la ronda siguiente

  for (var i = 0; i < size; i += 2){
    var sa = orden[i], sb = orden[i + 1];
    var ta = sa <= n ? teams[sa - 1] : null;
    var tb = sb <= n ? teams[sb - 1] : null;

    if (ta && tb){
      var g = {
        no: prefix + '-' + no, round: 1,
        a: { team: ta }, b: { team: tb }
      };
      games.push(g);
      slots.push({ from: g.no });
      no++;
    } else {
      slots.push({ team: ta || tb });          // pasa directo
    }
  }

  // Rondas siguientes: cada juego sale de dos ranuras de la anterior.
  var round = 2;
  while (slots.length > 1){
    var next = [];
    for (var k = 0; k < slots.length; k += 2){
      var left = slots[k], right = slots[k + 1];
      var gg = { no: prefix + '-' + no, round: round, a: left, b: right };
      games.push(gg);
      next.push({ from: gg.no });
      no++;
    }
    slots = next;
    round++;
  }

  // La última es la final; la anterior, semifinal.
  var last = games.length ? games[games.length - 1].round : 0;
  games.forEach(function(g){
    g.stage = g.round === last ? 'Final'
            : g.round === last - 1 ? 'Semifinal'
            : g.round === last - 2 ? 'Cuartos'
            : 'Ronda ' + g.round;
  });

  return { games: games, nextNo: no, byes: byes, bracket: size };
}

// ── Grupos, y luego eliminación ──────────────────────────────
// Todos contra todos dentro del grupo, y los primeros de cada
// grupo pasan al cuadro.
function pools(teams, perPool, advance, prefix, startNo){
  var n = teams.length;
  if (n < 2) return { games: [], nextNo: startNo };

  var count = Math.max(1, Math.ceil(n / perPool));
  var base = Math.floor(n / count), extra = n % count;

  var groups = [], at = 0;
  for (var g = 0; g < count; g++){
    var size = base + (g < extra ? 1 : 0);
    groups.push(teams.slice(at, at + size));
    at += size;
  }

  var games = [], no = startNo;
  var letter = 'ABCDEFGH';

  groups.forEach(function(gr, gi){
    for (var i = 0; i < gr.length; i++){
      for (var j = i + 1; j < gr.length; j++){
        games.push({
          no: prefix + '-' + no, round: 0,
          stage: count > 1 ? 'Grupo ' + letter[gi] : 'Grupo',
          group: letter[gi],
          a: { team: gr[i] }, b: { team: gr[j] }
        });
        no++;
      }
    }
  });

  // Quiénes pasan, cruzados: el primero de un grupo contra el
  // segundo de otro. Emparejarlos dentro del mismo grupo haría que
  // dos compañeros de grupo se eliminen en la primera ronda tras
  // haberse jugado ya.
  var through = [];
  for (var place = 1; place <= advance; place++){
    for (var gi = 0; gi < groups.length; gi++){
      if (groups[gi].length < place) continue;
      // los primeros en orden, los segundos al revés: 1A-2B, 1B-2A
      var idx = (place % 2 === 1) ? gi : (groups.length - 1 - gi);
      // Con un solo grupo la letra sobra, y además hacía que las
      // finales de todas las categorías se leyeran igual: "1º Grupo A
      // vs 2º Grupo A", tres veces.
      var etiqueta = groups.length > 1 ? place + 'º Grupo ' + letter[idx]
                                       : place + 'º';
      through.push({ place: etiqueta, seed: place, g: idx });
    }
  }

  // Intercalar para que el cuadro los coloque enfrentados.
  var firsts = through.filter(function(t){ return t.seed === 1; });
  var rest   = through.filter(function(t){ return t.seed !== 1; });
  through = [];
  for (var q = 0; q < Math.max(firsts.length, rest.length); q++){
    if (firsts[q]) through.push(firsts[q]);
    if (rest[q])   through.push(rest[q]);
  }

  var ko = knockout(through.map(function(t){ return t.place; }), prefix, no);
  ko.games.forEach(function(x){ x.fromPools = true; });

  return {
    games: games.concat(ko.games),
    nextNo: ko.nextNo,
    groups: groups.map(function(gr, gi){ return { name: letter[gi], teams: gr }; })
  };
}

// ── Repartir en canchas y horas ──────────────────────────────
// Una ronda no puede jugarse antes que la anterior, y un equipo no
// puede estar en dos canchas a la vez. Lo primero lo garantiza el
// orden; lo segundo se comprueba.
function slotTime(s){
  var h = parseInt(s.time, 10) % 12;
  if (/PM/i.test(s.time)) h += 12;
  return new Date(s.date + 'T' + String(h).padStart(2, '0') + ':00:00-04:00').getTime();
}

function schedule(allGames, slots, gapHours){
  var gap = (gapHours == null ? 1 : gapHours) * 3600 * 1000;
  var placed = [], when = {};          // no de juego → cuándo empieza

  // Por ronda: lo de la ronda 1 antes que lo de la 2.
  var byRound = allGames.slice().sort(function(a, b){
    return (a.round || 0) - (b.round || 0);
  });

  byRound.forEach(function(g){
    // No puede empezar hasta que hayan terminado los que lo alimentan.
    var earliest = 0;
    [g.a, g.b].forEach(function(side){
      if (side && side.from && when[side.from] != null){
        earliest = Math.max(earliest, when[side.from] + gap);
      }
    });

    for (var i = 0; i < slots.length; i++){
      var s = slots[i];
      if (s.taken) continue;

      // La categoría manda sobre la cancha: Mini en canastos de seis
      // pies no se puede poner en una cancha reglamentaria por mucho
      // que la hora esté libre.
      if (g.courts && g.courts.length && g.courts.indexOf(s.court) === -1) continue;

      var t = slotTime(s);
      if (t < earliest) continue;      // todavía no han jugado los suyos

      // Un equipo no puede estar en dos canchas a la vez.
      var clash = placed.some(function(p){
        if (p.date !== s.date || p.time !== s.time) return false;
        var names = [p.a.team, p.b.team, g.a.team, g.b.team].filter(Boolean);
        return names.length !== new Set(names).size;
      });
      if (clash) continue;

      s.taken = true;
      g.date = s.date; g.time = s.time; g.court = s.court;
      when[g.no] = t;
      placed.push(g);
      return;
    }

    // Sin hueco posible: queda sin hora, y la página lo dice.
    placed.push(g);
  });

  return placed;
}

// ── Las horas disponibles ────────────────────────────────────
function makeSlots(days, courts, fromHour, toHour){
  var out = [];
  days.forEach(function(d){
    for (var h = fromHour; h <= toHour; h++){
      courts.forEach(function(c){
        var hh = h % 12 || 12;
        var ap = h < 12 ? 'AM' : 'PM';
        out.push({ date: d, time: hh + ':00' + ap, court: c });
      });
    }
  });
  return out;
}

function cambiarIdioma(){
  LANG = (LANG === 'es' ? 'en' : 'es');
  try {
    localStorage.setItem('cfh_lang', LANG);
    localStorage.setItem('cp-lang', LANG);
    localStorage.setItem('fc-lang', LANG);
  } catch (e){}

  pintarEstatico();
  repintarFilas();
  document.getElementById('tituloModo').textContent =
    T(MODO === 'temporada' ? 'tituloTemporada' : 'tituloTorneo');
  document.getElementById('ledeModo').textContent =
    T(MODO === 'temporada' ? 'ledeTemporada' : 'ledeTorneo');
  // El calendario se vuelve a dibujar con lo que ya hay; no se
  // recalcula nada, así que ningún juego se mueve de sitio.
  if (RESULT) show();
  repintarCategorias();
}

/* Y las categorías que ya estén puestas. No se vuelven a dibujar:
   dibujarlas de nuevo le borraría al que monta el torneo los
   equipos que lleva escritos, que es media hora de trabajo. Se les
   cambia el texto por encima y se quedan como estaban.

   Las etiquetas van en el orden en que addDiv las escribe, y se
   saltan las de las canchas —label.pick— que llevan dentro el
   nombre de una cancha y no una palabra nuestra. */
function repintarCategorias(){
  var cajas = document.querySelectorAll('.div');
  var claves = ['tipo','numEquipos','formato','eqPorGrupo','cuantosPasan',
                'canchasCat','eqSiembra'];
  for (var i = 0; i < cajas.length; i++){
    var c = cajas[i];
    var h = c.querySelector('h3');
    if (h) h.textContent = T('categoria');

    var L = c.querySelectorAll('label:not(.pick)');
    for (var j = 0; j < L.length && j < claves.length; j++) L[j].textContent = T(claves[j]);

    var nom = c.querySelector('input[id^="dn"]');
    if (nom) nom.placeholder = T('phTipo');

    var fmt = c.querySelector('select[id^="df"]');
    if (fmt && fmt.options.length === 4){
      fmt.options[0].textContent = T('koDirecto');
      fmt.options[1].textContent = T('rr');
      fmt.options[2].textContent = T('rrf');
      fmt.options[3].textContent = T('koGrupos');
    }

    var x = c.querySelector('button.x');
    if (x) x.setAttribute('aria-label', T('quitar'));

    // Y la cuenta de abajo, que es una frase entera.
    var id = Number(String(c.id).replace('div', ''));
    if (id) divCount(id);
  }
}

/* Las etiquetas de las filas de juego que ya existen. */
function repintarFilas(){
  var f = document.querySelectorAll('.sjuego');
  for (var i = 0; i < f.length; i++){
    var L = f[i].querySelectorAll('label');
    var k = ['contraQuien','queDia','hora','cancha','donde','padrinos'];
    for (var j = 0; j < L.length && j < k.length; j++) L[j].textContent = T(k[j]);
    var casa = f[i].querySelector('.sCasa');
    if (casa){ casa.options[0].textContent = T('enCasa');
               casa.options[1].textContent = T('deVisita'); }
    var rec = f[i].querySelector('.sRecauda');
    if (rec){ rec.options[0].textContent = T('si');
              rec.options[1].textContent = T('no'); }
    var b = f[i].querySelector('.sborrar');
    if (b) b.textContent = T('quitar');
  }
  sNumerar();
}

  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
  });
}

function hours(){
  // Arranca en blanco: la hora de un torneo la pone quien lo monta, y
  // una hora puesta de antemano es una hora que nadie miró.
  var out = '<option value=""></option>';
  for (var h = 8; h <= 22; h++){
    var hh = h % 12 || 12, ap = h < 12 ? 'AM' : 'PM';
    out += '<option value="' + h + '">' + hh + ':00' + ap + '</option>';

  return out;
}

      '<div class="picks" id="dcz' + id + '"></div>' +
    '</div>' +
    '<label>' + T('eqSiembra') + '</label>' +
    '<div id="dt' + id + '"></div>' +
    '<div class="count" id="dc' + id + '"></div>';
  document.getElementById('divs').appendChild(box);

  // Hasta 32 equipos, y arranca en blanco: la cantidad la pone quien
  // monta la categoría, no el formulario.
  var sel = document.getElementById('dq' + id), o = '<option value=""></option>';
  for (var i = 2; i <= 32; i++) o += '<option value="' + i + '">' + i + '</option>';
  sel.innerHTML = o;
  drawPicks(id);

  if (teams){                      // sembrar de una lista, si viene una
    var l = String(teams).split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if (l.length >= 2){
      sel.value = Math.min(32, l.length);
      l.forEach(function(nombre, k){ TEAMNAME[id + '-' + (k + 1)] = nombre; });
    }
  }

  drawTeams(id);
}

function dropDiv(id){
  DIVS = DIVS.filter(function(x){ return x !== id; });
  var el = document.getElementById('div' + id);
  if (el) el.remove();
}

function divMode(id){
  var pools = document.getElementById('df' + id).value === 'pools';
  document.getElementById('dp' + id).style.display = pools ? '' : 'none';
  divCount(id);
}

// ── En qué canchas juega una categoría ──────────────────────
// Mini juega en canastos de seis pies. Ponerla en una cancha
// reglamentaria no es incómodo: es un juego que no se puede jugar. El
// calendario tiene que saberlo antes de repartir las horas.
//
// Se marcan todas por defecto, porque lo normal es que una categoría
// pueda jugar donde sea; lo que hay que decir es la excepción.
function drawPicks(id){
  var caja = document.getElementById('dcz' + id);
  var marco = document.getElementById('dcw' + id);
  if (!caja) return;

  var antes = {};
  [].forEach.call(caja.querySelectorAll('input[data-c]'), function(el){
    antes[el.getAttribute('data-c')] = el.checked;
  });

  var cs = courts(), html = '';
  cs.forEach(function(c){
    var on = antes[c.id] === undefined ? true : antes[c.id];
    html += '<label class="pick"><input type="checkbox" data-c="' + esc(c.id) + '"' +
              (on ? ' checked' : '') + ' onchange="divCount(' + id + ')">' +
              '<span><b>' + esc(c.id) + '</b>' +
                (c.name && c.name !== c.id ? ' ' + esc(c.name) : '') + '</span>' +
            '</label>';
  });
  caja.innerHTML = html;

  // Con una sola cancha no hay nada que escoger.
  if (marco) marco.style.display = cs.length > 1 ? '' : 'none';
}

// Al cambiar la cantidad de canchas, o el nombre de una, todas las
// categorías tienen que volver a dibujar sus casillas.
function allPicks(){
  DIVS.forEach(function(id){ drawPicks(id); divCount(id); });
}

function courtsOf(id){
  var caja = document.getElementById('dcz' + id);
  if (!caja) return courts().map(function(c){ return c.id; });
  var out = [];
  [].forEach.call(caja.querySelectorAll('input[data-c]'), function(el){
    if (el.checked) out.push(el.getAttribute('data-c'));
  });
  return out;
}

// ── Los equipos de una categoría ────────────────────────────
// Una casilla por equipo, con su número de siembra a la vista. Antes
// era un textarea que decía «en orden de siembra» y no mostraba
// ninguno: el orden decidía el cuadro entero sin que se viera.
//
// El nombre escrito se guarda aparte del campo, igual que las
// canchas: cambiar de 8 equipos a 4 y volver a 8 no borra nada.
var TEAMNAME = {};

function drawTeams(id){
  var caja = document.getElementById('dt' + id);
  if (!caja) return;

  [].forEach.call(caja.querySelectorAll('input[data-t]'), function(el){
    TEAMNAME[el.getAttribute('data-t')] = el.value;
  });

  var n = Number(document.getElementById('dq' + id).value) || 0, html = '';
  for (var i = 1; i <= n; i++){
    var k = id + '-' + i;
    html += '<div class="cr t">' +
        '<span class="tag">' + i + '</span>' +
        '<input id="dt' + id + '_' + i + '" data-t="' + k + '" value="' +
          esc(TEAMNAME[k] || '') + '" placeholder="Nombre del equipo" ' +
          'oninput="divCount(' + id + ')" ' +
          'onpaste="pasteTeams(event,' + id + ',' + i + ')"></div>';
  }
  caja.innerHTML = html;
  divCount(id);
}

// Pegar una lista entera en cualquier casilla la reparte hacia abajo,
// y sube la cantidad si hacen falta más casillas. Los equipos llegan
// en una lista —de un chat, de un papel— casi nunca de uno en uno.
function pasteTeams(ev, id, desde){
  var txt = ((ev.clipboardData || window.clipboardData) || {}).getData;
  txt = txt ? (ev.clipboardData || window.clipboardData).getData('text') : '';
  var l = String(txt || '').split(/\r?\n/)
    .map(function(s){ return s.trim(); }).filter(Boolean);
  if (l.length < 2) return;                  // una sola línea: pegado normal

  ev.preventDefault();

  var sel = document.getElementById('dq' + id);
  var hacen = desde - 1 + l.length;
  if (hacen > (Number(sel.value) || 0) && hacen <= 32){
    sel.value = hacen;
    drawTeams(id);
  }

  l.forEach(function(nombre, k){
    var el = document.getElementById('dt' + id + '_' + (desde + k));
    if (el){ el.value = nombre; TEAMNAME[id + '-' + (desde + k)] = nombre; }
  });
  divCount(id);
}

function teamsOf(id){
  var n = Number(document.getElementById('dq' + id).value) || 0, out = [];
  for (var i = 1; i <= n; i++){
    var el = document.getElementById('dt' + id + '_' + i);
    var v = el ? (el.value || '').trim() : '';
    if (v) out.push(v);
  }
  return out;
}

function divCount(id){
  var t = teamsOf(id), el = document.getElementById('dc' + id);
  if (!el) return;

  // Lo pedido y lo escrito son dos cosas: escoger 8 y escribir 6 deja
  // una categoría de 6, y más vale decirlo aquí que al generar.
  var pide = Number(document.getElementById('dq' + id).value) || 0;
  if (!pide){ el.textContent = T('escogeCuantos'); return; }
  if (t.length < pide){
    el.textContent = T('deEqEscritos', { A: t.length, B: pide });
    return;
  }
  if (t.length < 2){ el.textContent = T('min2'); return; }

  var mode = document.getElementById('df' + id).value;

  if (mode === 'rr' || mode === 'rrf'){
    var liga = t.length * (t.length - 1) / 2;
    el.textContent = t.length + ' ' + T('equipos') + ' · ' +
      (mode === 'rrf' ? liga + 1 : liga) + ' ' + T('juegos') + ' · ' +
      T('cadaJuega') + ' ' + (t.length - 1) +
      (mode === 'rrf' ? T('yFinal') : '');
    return;
  }

  if (mode === 'ko'){
    var size = 1; while (size < t.length) size *= 2;
    el.textContent = t.length + ' ' + T('equipos') + ' · ' + (t.length - 1) + ' ' +
      T('juegos') + ' · ' + (size - t.length) + ' ' + T('pasanDirecto');
  } else {
    var per = Number(document.getElementById('dps' + id).value) || 4;
    var adv = Number(document.getElementById('dpa' + id).value) || 2;
    var g = Math.max(1, Math.ceil(t.length / per));
    var base = Math.floor(t.length / g), extra = t.length % g, pg = 0;
    for (var i = 0; i < g; i++){ var sz = base + (i < extra ? 1 : 0); pg += sz * (sz - 1) / 2; }
    var through = Math.min(adv * g, t.length);
    el.textContent = t.length + ' ' + T('equipos') + ' · ' + g + ' ' + T('grupos') + ' · ' +
      pg + ' ' + T('juegosGrupo') + ' · ' + through + ' ' + T('pasanCuadro');
  }
}

// ── Las canchas ─────────────────────────────────────────────
// El identificador lo pone el constructor —C-1, C-2— y lo único que
// hay que escribir es el nombre. Antes era un textarea donde cada
// línea llevaba las dos cosas separadas por una coma, y una cancha
// escrita sin coma se quedaba con el nombre entero de identificador:
// «Cancha Municipal de Loíza» en la casilla de cada uno de sus juegos.
function courts(){
  var n = Number(document.getElementById('tCourtN').value) || 1, out = [];
  for (var i = 1; i <= n; i++){
    var id = 'C-' + i;
    var campo = document.getElementById('cn' + i);
    var nombre = campo ? (campo.value || '').trim() : '';
    out.push({ id: id, name: nombre || id });
  }
  return out;
}

// El nombre escrito se guarda aparte del campo: bajar de cuatro
// canchas a dos y volver a cuatro no borra lo que ya estaba puesto.
var COURTNAME = {};

function drawCourts(){
  var caja = document.getElementById('courtRows');

  // Recoger lo que haya escrito antes de redibujar.
  [].forEach.call(caja.querySelectorAll('input[data-c]'), function(el){
    COURTNAME[el.getAttribute('data-c')] = el.value;
  });

  var n = Number(document.getElementById('tCourtN').value) || 1, html = '';
  for (var i = 1; i <= n; i++){
    var id = 'C-' + i;
    html += '<div class="cr">' +
        '<span class="tag">' + id + '</span>' +
        '<input id="cn' + i + '" data-c="' + id + '" value="' +
          esc(COURTNAME[id] || '') + '" placeholder="Nombre de la cancha" ' +
          'oninput="allPicks()">' +
      '</div>';
  }
  caja.innerHTML = html;

  // Las casillas de cada categoría siguen a las canchas: quitar una
  // cancha tiene que quitarla de todas las categorías a la vez.
  if (typeof allPicks === 'function') allPicks();
}

function days(){
  var a = document.getElementById('tFrom').value, b = document.getElementById('tTo').value;
  if (!a) return [];
  if (!b) b = a;
  var out = [], d = new Date(a + 'T12:00:00'), end = new Date(b + 'T12:00:00');
  while (d <= end && out.length < 30){
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

var RESULT = null;

// Las iniciales del torneo, que son el prefijo de cada número de
// juego. Antes todos los torneos numeraban J-1, J-2... y los
// marcadores se guardan por número sin decir de qué torneo son: un
// calendario nuevo salía con los marcadores del anterior encima, y
// como una fila con marcador esconde sus botones de promesa, también
// se perdían los enlaces de Cada Punto.
function siglas(nombre){
  var ini = String(nombre || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .split(/[^A-Za-z0-9]+/).filter(Boolean)
    .map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
  return (ini || 'T').slice(0, 3);
}

function generate(){
  var ds = days(), cs = courts();

  // El nombre no es adorno: de él salen las siglas que numeran cada
  // juego, el nombre del archivo y la descripción que se ve al
  // compartir el enlace. Sin nombre, todo torneo numeraría T-1, T-2 —
  // y los marcadores se guardan por número.
  if (!(document.getElementById('tName').value || '').trim())
    return alert(T('ponNombre'));

  if (!ds.length) return alert(T('ponPrimerDia'));

  // Las horas van vacías al abrir, así que hay que pedirlas antes de
  // usarlas: en blanco valen 0 y el calendario entero saldría a las
  // doce de la noche.
  var h1 = document.getElementById('tStart').value;
  var h2 = document.getElementById('tEnd').value;
  if (!h1 || !h2) return alert(T('ponHoras'));

  var from = Number(h1), to = Number(h2);
  if (to < from) return alert(T('horaAlReves'));

  if (!cs.length) return alert(T('ponCancha'));
  if (!DIVS.length) return alert(T('anadeCat'));

  // Una categoría sin ninguna cancha marcada no tiene dónde jugar, y
  // sus juegos saldrían todos sin hora sin decir por qué.
  for (var z = 0; z < DIVS.length; z++){
    if (teamsOf(DIVS[z]).length < 2) continue;        // ésa ya se salta sola
    if (!courtsOf(DIVS[z]).length){
      var qn = (document.getElementById('dn' + DIVS[z]).value || '').trim() || T('unaCat');
      return alert(T('marcaCancha', { Q: qn }));
    }
  }

  var slots = makeSlots(ds, cs.map(function(c){ return c.id; }), from, to);

  // El prefijo sale del nombre del torneo, así dos calendarios
  // distintos nunca comparten números — ni marcadores.
  var PFX = siglas((document.getElementById('tName').value || '').trim());

  var all = [], no = 1, colour = {}, ci = 0;

  DIVS.forEach(function(id){
    var name = (document.getElementById('dn' + id).value || '').trim() || T('categoria');
    var teams = teamsOf(id);
    if (teams.length < 2) return;

    colour[name] = PALETTE[ci++ % PALETTE.length];

    /* Todos contra todos es un solo grupo con todos dentro. Con uno
       que pase, pools() no arma cuadro ninguno y queda la liga sola;
       con dos, arma un único juego entre el primero y el segundo,
       que es la final. No hace falta motor nuevo. */
    var mode = document.getElementById('df' + id).value, built;
    if (mode === 'rr')         built = pools(teams, teams.length, 1, PFX, no);
    else if (mode === 'rrf')   built = pools(teams, teams.length, 2, PFX, no);
    else if (mode === 'pools') built = pools(teams,
                                   Number(document.getElementById('dps' + id).value) || 4,
                                   Number(document.getElementById('dpa' + id).value) || 2,
                                   PFX, no);
    else                       built = knockout(teams, PFX, no);

    // Cada juego se lleva las canchas en que su categoría puede jugar.
    var permitidas = courtsOf(id);
    built.games.forEach(function(g){ g.cat = name; g.courts = permitidas; });
    all = all.concat(built.games);
    no = built.nextNo;
  });

  if (!all.length) return alert(T('sinEquipos'));

  var placed = schedule(all, slots, 1);
  RESULT = {
    prefix: PFX,
    tourney: {
      name:  (document.getElementById('tName').value || '').trim(),
      where: (document.getElementById('tWhere').value || '').trim(),
      courts: cs
    },
    home: (document.getElementById('tHome').value || '').trim() || null,
    colour: colour,
    games: placed.map(function(g){
      return {
        no: g.no, cat: g.cat, stage: g.stage || '',
        date: g.date || '', time: g.time || '', court: g.court || '',
        a: g.a.team || ('Ganador ' + g.a.from),
        b: g.b.team || ('Ganador ' + g.b.from)
      };
    })
  };

  show();
}

// ══════════════════════════════════════════════════════════════
//  LA TEMPORADA DE UN EQUIPO
//
//  Llena el MISMO RESULT que genera el cuadro de un torneo. Todo lo
//  que viene después —registrar, enlazar las campañas, el enlace, la
//  página, los botones de prometer— no sabe cuál de los dos lo
//  escribió, y no tiene por qué saberlo.
//
//  Lo que NO hay aquí, y es el punto: prefijo, categorías, siembras,
//  rondas, horarios automáticos. Un entrenador sabe contra quién
//  juega y qué día. Lo demás era mobiliario de torneo.
// ══════════════════════════════════════════════════════════════

var MODO = 'torneo';

/* El deporte del calendario que se está montando. Viaja con el
   registro y la página pública lo lee para saber cómo enseñar un
   marcador. No toca nada del dinero. */
var DEPORTE = 'baloncesto';

function deporte(cual){
  DEPORTE = (cual === 'voleibol') ? 'voleibol' : 'baloncesto';
  document.getElementById('btnBalon').className = 'modo' + (DEPORTE === 'baloncesto' ? ' on' : '');
  document.getElementById('btnVoli').className  = 'modo' + (DEPORTE === 'voleibol'   ? ' on' : '');
  // El título y la entradilla cambian con el deporte: un entrenador
  // de voleibol no monta «juegos», monta partidos.
  document.getElementById('tituloModo').textContent = tituloDe(MODO);
  document.getElementById('ledeModo').textContent   = ledeDe(MODO);
  repintarFilas();
  if (RESULT) show();
}

/* Los títulos y las entradillas viven en el diccionario, como todo
   lo demás; esto sólo dice cuál va con cuál. */
function ledeDe(cual){ return T(cual === 'temporada' ? 'ledeTemporada' : 'ledeTorneo'); }
function tituloDe(cual){ return T(cual === 'temporada' ? 'tituloTemporada' : 'tituloTorneo'); }

function modo(cual){
  MODO = cual;
  document.getElementById('paneTorneo').style.display    = cual === 'torneo' ? '' : 'none';
  document.getElementById('paneTemporada').style.display = cual === 'temporada' ? '' : 'none';
  document.getElementById('btnTorneo').className    = 'modo' + (cual === 'torneo' ? ' on' : '');
  document.getElementById('btnTemporada').className = 'modo' + (cual === 'temporada' ? ' on' : '');
  document.getElementById('tituloModo').textContent = tituloDe(cual);
  document.getElementById('ledeModo').textContent   = ledeDe(cual);
  // El calendario de un modo no tiene nada que hacer en el otro.
  document.getElementById('out').innerHTML = '';
  RESULT = null;
  if (cual === 'temporada' && !document.querySelectorAll('.sjuego').length) sAnadir();
}

/* LAS HORAS, DE CUARTO EN CUARTO.

   Escribirla a mano daba cuatro formas de la misma hora —«7pm»,
   «7:00», «19:00», «7:00 p.m.»— y el calendario las enseña tal cual
   se guardaron, así que un torneo acababa con cuatro maneras de
   decir las siete. Con una lista no hay forma de escribirlo mal, y
   en el teléfono se escoge de una rueda en vez de teclear.

   De 7 de la mañana a 10:45 de la noche, que cubre desde el primer
   juego de un sábado de torneo hasta el último de una noche entre
   semana. Y vacía de primera: la hora es opcional y un juego sin
   confirmar todavía no tiene ninguna. */
var HORAS = (function(){
  var o = ['<option value="">—</option>'];
  for (var h = 7; h <= 22; h++){
    var r = h % 12; if (r === 0) r = 12;
    var ap = h < 12 ? 'AM' : 'PM';
    for (var m = 0; m < 60; m += 15){
      var t = r + ':' + (m < 10 ? '0' + m : m) + ' ' + ap;
      o.push('<option value="' + t + '">' + t + '</option>');
    }
  }
  return o.join('');
})();

function sAnadir(){
  var d = document.createElement('div');
  d.className = 'sjuego';
  d.innerHTML =
    '<b class="sjn"></b>' +
    '<div><label>' + T('contraQuien') + '</label>' +
      '<input class="sRival" autocapitalize="words"></div>' +
    '<div><label>' + T('queDia') + '</label><input class="sFecha" type="date"></div>' +
    '<div><label>' + T('hora') + '</label><select class="sHora">' + HORAS + '</select></div>' +
    '<div><label>' + T('cancha') + '</label>' +
      '<input class="sCancha" autocapitalize="words"></div>' +
    '<div><label>' + T('donde') + '</label><select class="sCasa">' +
      '<option value="1">' + T('enCasa') + '</option>' +
      '<option value="0">' + T('deVisita') + '</option></select></div>' +
    /* Si en ESE juego hay padrinos. Un entrenador sube su temporada
       entera y quiere padrinos en tres juegos, no en los veinte; los
       otros los quiere en el marcador y nada más. Es un select y no
       una casilla para que se lea igual que «En casa / De visita» y
       para que en el teléfono caiga en la misma rejilla. */
    '<div><label>' + T('padrinos') + '</label><select class="sRecauda">' +
      '<option value="1">' + T('si') + '</option>' +
      '<option value="0">' + T('no') + '</option></select></div>' +
    '<button class="sborrar" type="button">' + T('quitar') + '</button>';
  d.querySelector('.sborrar').onclick = function(){
    d.remove();
    if (!document.querySelectorAll('.sjuego').length) sAnadir();
    sNumerar();
  };
  document.getElementById('sJuegos').appendChild(d);
  sNumerar();
}

/* «Juego 1», «Juego 2»… Se vuelve a contar al añadir y al quitar,
   porque si no, quitar el segundo de cuatro deja un 1, un 3 y un 4 y
   el entrenador se queda mirando a ver qué se perdió. Sólo se ve en
   el teléfono; a lo ancho, la fila ya se explica sola. */
function sNumerar(){
  var f = document.querySelectorAll('.sjuego');
  for (var i = 0; i < f.length; i++){
    var n = f[i].querySelector('.sjn');
    if (n) n.textContent = T('juegoN', { N: i + 1 });
  }
}

function sDice(t, mal){
  var e = document.getElementById('sMsg');
  if (e){ e.textContent = t || ''; e.style.color = mal ? '#ff8a8a' : ''; }
}

/* El prefijo sale del nombre del equipo y no se pregunta: es lo que
   numera los juegos —ARE-1, ARE-2— y a un entrenador no le dice nada.
   Se quitan tildes para que no salga un número con eñes dentro. */
function sPrefijo(nombre){
  var limpio = (nombre || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
                 .replace(/[^A-Za-z ]/g, '').trim();
  var palabras = limpio.split(/\s+/).filter(Boolean);
  var p = palabras.length >= 2
    ? palabras.slice(0, 3).map(function(w){ return w[0] }).join('')
    : (palabras[0] || 'EQ').slice(0, 3);
  return p.toUpperCase() || 'EQ';
}

function construirTemporada(){
  var equipo = (document.getElementById('sTeam').value || '').trim();
  var pueblo = (document.getElementById('sWhere').value || '').trim();
  if (!equipo) return sDice(T('faltaEquipo'), true);

  var filas = [].slice.call(document.querySelectorAll('.sjuego'));
  var juegos = [], n = 0, pfx = sPrefijo(equipo);

  for (var i = 0; i < filas.length; i++){
    var f = filas[i];
    var rival  = (f.querySelector('.sRival').value  || '').trim();
    var fecha  = (f.querySelector('.sFecha').value  || '').trim();
    var hora   = (f.querySelector('.sHora').value   || '').trim();
    var cancha = (f.querySelector('.sCancha').value || '').trim();
    var casa   = f.querySelector('.sCasa').value === '1';
    var rec    = f.querySelector('.sRecauda').value === '1';

    // Una fila vacía del todo se salta: es la que quedó de más.
    if (!rival && !fecha) continue;
    if (!rival) return sDice(T('faltaRival', { N: i + 1 }), true);
    if (!fecha) return sDice(T('faltaFecha', { R: rival }), true);

    n++;
    /* EL LOCAL VA PRIMERO. La página marca H y A mirando cuál de los
       dos lados es el equipo de casa; poniendo siempre el mío de
       primero, todos mis juegos saldrían como locales. */
    juegos.push({
      no: pfx + '-' + n, cat: '', stage: '',
      date: fecha, time: hora, court: cancha,
      a: casa ? equipo : rival,
      b: casa ? rival  : equipo,
      /* Viaja con el juego hasta la base, que lo usa de semilla. A
         partir de ahí manda la página del equipo: si el entrenador lo
         apaga allí y vuelve aquí a mover una hora, no se le borra. */
      recauda: rec
    });
  }

  if (!juegos.length) return sDice(T('faltaJuego'), true);

  RESULT = {
    prefix: pfx,
    tourney: {
      name:  equipo,
      where: pueblo,
      // Las canchas con nombre son cosa de un torneo con varias a la
      // vez; aquí cada juego trae la suya escrita.
      courts: []
    },
    /* VA VACÍO A PROPÓSITO, y es lo contrario de lo que parece.
       `home` no quiere decir «mi equipo»: quiere decir «el equipo de
       casa DEL TORNEO», el que juega en su pueblo y por eso es local
       aunque el sorteo lo ponga abajo. La página usa eso para darle
       la vuelta a la H y la A.

       En una temporada esa vuelta sobra, porque aquí el local ya va
       de primero en cada juego — lo pone el «Dónde» de cada fila. Con
       el nombre puesto, la página veía a mi equipo abajo en un juego
       de visita y le ponía la H: el calendario decía que yo era local
       en un juego que juego fuera. Vacío, manda la fila, que es la
       que sabe.

       Lo único que se pierde es el tinte naranja de «éste es mi
       juego», que en una temporada no dice nada: todos lo son. El
       botón de prometer no depende de esto — va por el id del juego. */
    home: '',
    colour: {},
    games: juegos
  };

  sDice(juegos.length === 1 ? T('unJuego')
        : T('nJuegos', { N: juegos.length }), false);
  show();
}

// ── Local y visitante ───────────────────────────────────────
// No hay nada que escribir: el cuadro ya lo dice. El de arriba de
// cada juego es el local, que en la primera ronda es siempre el mejor
// sembrado de los dos, y en las siguientes el que viene de la mitad
// alta del cuadro.
//
// La única excepción es el equipo de casa del torneo: juega en su
// pueblo, así que es local en los suyos aunque el sorteo lo ponga
// abajo. Se cambia la etiqueta y nada más — mover el equipo de sitio
// cambiaría a qué ranura del cuadro alimenta su juego.
function lado(g, casa){
  var esCasa = function(n){ return casa && String(n).indexOf(casa) === 0; };
  return (esCasa(g.b) && !esCasa(g.a)) ? ['A', 'H'] : ['H', 'A'];
}

function show(){
  var r = RESULT;
  var missing = r.games.filter(function(g){ return !g.date; });

  var html =
    '<div class="out">' +
      '<div class="cap">' + T('calGenerado') + '</div>' +
      '<div class="big">' + (r.games.length === 1 ? T('unJuegoOut')
                             : T('nJuegosOut', { N: r.games.length })) + '</div>' +
    '</div>';

  if (missing.length){
    html += '<div class="warn"><b>' + (missing.length === 1 ? T('unSinHora')
                                       : T('sinHora', { N: missing.length })) + '</b> ' +
      T('noCaben') + '</div>';
  }

  html += '<table><tr><th>' + T('thJuego') + '</th><th>' + T('thDia') + '</th>' +
          '<th>' + T('thHora') + '</th><th>' + T('thCancha') + '</th>' +
          '<th>' + T('thJuego') + '</th><th>' + T('thCat') + '</th></tr>' +
    r.games.map(function(g){
      return '<tr>' +
        '<td class="n">' + esc(g.no) + '</td>' +
        '<td class="n">' + (g.date ? esc(g.date.slice(5)) : '—') + '</td>' +
        '<td class="n">' + (g.time ? esc(g.time) : '—') + '</td>' +
        '<td class="n">' + (g.court ? esc(g.court) : '—') + '</td>' +
        '<td><b class="hat">' + lado(g, r.home)[0] + '</b>' + esc(g.a) +
          ' <span style="color:#5A6B7C">vs</span> ' +
          '<b class="hat">' + lado(g, r.home)[1] + '</b>' + esc(g.b) +
          (g.stage ? ' <span style="color:#5A6B7C">· ' + esc(g.stage) + '</span>' : '') + '</td>' +
        '<td>' + esc(g.cat) + '</td>' +
      '</tr>';
    }).join('') +
  '</table>' +

  /* REGISTRAR VA PRIMERO, Y LA DESCARGA DEPENDE DE ÉL.
     Antes bajar era el botón grande y registrar el pequeño de abajo,
     así que el camino obvio producía un fichero y ninguna copia: un
     torneo entero podía existir sólo como un .html en la carpeta de
     descargas de alguien, invisible en el admin. Pasó con Copa Puerto
     Rico el primer día.

     Ahora el orden dice la verdad: la base es el registro y el
     fichero es una foto de él. Y como la foto se saca DESPUÉS, no
     puede salir de una versión distinta de la registrada. */
  '<h2 style="margin-top:30px">' + T('paso1') + '</h2>' +
  '<p class="hint" style="margin:0 0 10px">' + T('paso1p') + '</p>' +
  '<label>' + T('lCodigo') + '</label>' +
  '<input id="regCode" type="password" autocomplete="off" value="' +
    esc(codigoGuardado()) + '">' +
  '<button class="btn" onclick="registrar()">' + T('btnRegistrar') + '</button>' +
  '<p class="hint" id="regMsg" style="font-weight:800;min-height:1.3em"></p>' +

  /* EL ENLACE ES LO QUE SE LLEVA, y por eso es el paso 2 y el
     fichero bajó al 3.

     Hasta hoy el único final de este formulario era un .html que
     alguien tenía que subir al repo de marcadorpr — y ese alguien
     era siempre el dueño del repo. Un entrenador en Loíza un viernes
     por la noche no podía dar ese paso, así que los únicos torneos
     que corrían eran los que se subían a mano.

     Ahora el calendario se lee de la base: registrar ES publicar, y
     lo que el entrenador se lleva es una dirección que puede mandar
     por WhatsApp sin que nadie toque nada. */
  '<h2 style="margin-top:28px">' + T('paso2') + '</h2>' +
  '<p class="hint" id="enlaceMsg" style="margin:0 0 10px">' + T('paso2p') + '</p>' +
  '<div id="enlaceCaja" style="display:none">' +
    '<input id="enlaceUrl" readonly onclick="this.select()" ' +
      'style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem">' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">' +
      '<button class="btn" type="button" onclick="copiarEnlace()" id="btnCopiar">' +
        T('copiarEnlace') + '</button>' +
      '<a class="btn line" id="enlaceVer" target="_blank" rel="noopener">' +
        T('abrirlo') + '</a>' +
    '</div>' +
    '<p class="hint" style="margin-top:10px">' + T('mandaWhats') + '</p>' +
  '</div>' +

  '<h2 style="margin-top:28px">' + T('paso3') + '</h2>' +
  '<button class="btn line" id="btnBajar" disabled onclick="download()">' +
    T('bajarPag') + '</button>' +
  '<p class="hint" id="bajarMsg">' + T('bajarMsg') + '</p>';

  // Un calendario recién generado todavía no está registrado, aunque
  // el anterior lo estuviera: lo que se registró era otro.
  REGISTRADO = false;

  document.getElementById('out').innerHTML = html;
  document.getElementById('out').scrollIntoView({ behavior:'smooth', block:'start' });
}

/* Si está registrado el calendario que hay ahora mismo en RESULT. Se
   apaga al generar y se enciende al registrar, así que cambiar una
   hora y volver a generar vuelve a pedir el registro — que es lo
   correcto: el fichero de antes ya no es foto de nada. */
var REGISTRADO = false;

function permitirBajar(){
  REGISTRADO = true;
  var b = document.getElementById('btnBajar');
  if (b){ b.disabled = false; b.className = 'btn line'; }
}

/* ── EL ESTILO DEL CALENDARIO ───────────────────────────────────
   Tres cosas que la página necesita para pintarse y que el registro
   no guarda: el NOMBRE de cada cancha (en el juego sólo vive «C-1»),
   el equipo de CASA, y el COLOR de cada categoría.

   Va en su propia llamada y no dentro de bw_register_tournament a
   propósito: esa función ya vive en cuatro ficheros y una quinta
   copia significaría arrastrar a mano el enlace de juegos entero.
   Lo que se paga por tenerlo aparte es esto — si falla, el torneo
   queda publicado igual, sólo que con las canchas por su código y
   todas las categorías del mismo color. Se degrada, no se rompe, y
   volver a registrar lo arregla. */
function guardarEstilo(code, slug){
  rpcC('torneo_estilo', {
    p_code:    code,
    p_id:      slug,
    p_canchas: RESULT.tourney.courts || [],
    p_casa:    RESULT.home || null,
    p_colores: RESULT.colour || {}
  }).then(function(r){
    if (!r || !r.ok) console.warn('torneo_estilo:', r && r.reason);
  }).catch(function(e){ console.warn('torneo_estilo:', e); });
}

/* ── EL ENLACE PÚBLICO ──────────────────────────────────────────
   Se enseña en cuanto el torneo queda registrado, porque desde ese
   momento la dirección ya responde: torneo.html lee el calendario de
   la base, no de ningún fichero. */
var ENLACE = '';
function mostrarEnlace(slug){
  ENLACE = 'https://marcadorpr.com/torneo.html?t=' + encodeURIComponent(slug);
  var caja = document.getElementById('enlaceCaja');
  var msg  = document.getElementById('enlaceMsg');
  var inp  = document.getElementById('enlaceUrl');
  var ver  = document.getElementById('enlaceVer');
  if (inp) inp.value = ENLACE;
  if (ver) ver.href = ENLACE;
  if (msg) msg.textContent = T('paso2ok');
  if (caja) caja.style.display = '';
}

function copiarEnlace(){
  var b = document.getElementById('btnCopiar');
  var ok = function(){
    if (!b) return;
    b.textContent = T('copiado');
    setTimeout(function(){ b.textContent = T('copiarEnlace'); }, 2000);
  };
  /* El portapapeles moderno falla en http y en algunos navegadores
     embebidos, que es justo donde va a estar un entrenador. Si falla,
     se selecciona el texto para que copiarlo sea un gesto. */
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ENLACE).then(ok, function(){
      var i = document.getElementById('enlaceUrl'); if (i){ i.focus(); i.select(); }
    });
    return;
  }
  var i = document.getElementById('enlaceUrl');
  if (i){ i.focus(); i.select(); try { document.execCommand('copy'); ok(); } catch (e){} }
}

function download(){
  var r = RESULT;

  /* El botón está apagado hasta que se registra, pero la guardia va
     también aquí: un botón apagado se enciende desde la consola en
     dos segundos, y lo que no puede pasar es que exista un calendario
     publicado que el admin no conozca. */
  if (!REGISTRADO){
    alert(T('bajaDespues'));
    return;
  }

  var slug = r.tourney.name.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'torneo';

  // La descripción sale del torneo, no de una copia pegada: antes
  // decía "las 80 partidas de Basketween" en todos los calendarios.
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];
  function dpart(iso){
    var x = new Date(iso + 'T12:00:00');
    return { d: x.getDate(), m: MESES[x.getMonth()] };
  }
  // "del 18 al 20 de diciembre", no "del 18 de diciembre al 20 de
  // diciembre": el mes se dice una sola vez si es el mismo.
  function span(a, b){
    var x = dpart(a), y = dpart(b);
    if (a === b) return 'el ' + x.d + ' de ' + x.m;
    return 'del ' + x.d + (x.m === y.m ? '' : ' de ' + x.m) +
           ' al ' + y.d + ' de ' + y.m;
  }
  var ds = r.games.map(function(g){ return g.date; })
            .filter(Boolean).sort();
  var nc = r.games.reduce(function(acc, g){
    if (g.court && acc.indexOf(g.court) === -1) acc.push(g.court);
    return acc;
  }, []).length;
  var ng = r.games.length;
  var desc = (ng === 1 ? 'La partida de ' : 'Las ' + ng + ' partidas de ') +
    r.tourney.name +
    (nc ? ', en ' + nc + ' cancha' + (nc === 1 ? '' : 's') : '') +
    (r.tourney.where ? ' de ' + r.tourney.where : '') +
    (ds.length ? ', ' + span(ds[0], ds[ds.length - 1]) : '') +
    '. Los marcadores según van entrando.';
  desc = desc.replace(/"/g, '&quot;');

  var page = TEMPLATE
    .split('__TOURNEY__').join(JSON.stringify(r.tourney))
    .split('__HOME__').join(JSON.stringify(r.home))
    .split('__GAMES__').join(JSON.stringify(r.games))
    .split('__CATCOLOR__').join(JSON.stringify(r.colour))
    .split('__DEPORTE__').join(JSON.stringify(DEPORTE))
    .split('__NAME__').join(r.tourney.name)
    .split('__KICKER__').join(r.tourney.where || 'Torneo')
    .split('__DESC__').join(desc)
    .split('__SLUG__').join(slug);

  var blob = new Blob([page], { type: 'text/html' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = slug + '.html';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

// ══════════════════════════════════════════════════════════════
//  REGISTRAR EL TORNEO
//
//  Hasta ahora este constructor no escribía una sola fila: montaba
//  la página, la bajabas, la subías, y el torneo existía únicamente
//  como un fichero. El admin de Cada Punto no tenía de dónde saber
//  que existía — lo único que ataba un juego a su torneo era el
//  prefijo de su número, y eso sólo llega a la base cuando alguien
//  le pone un marcador o una promesa.
//
//  Registrarlo escribe el calendario entero, incluidos los juegos
//  que nadie va a jugar hasta el domingo. Es lo que deja al admin
//  enseñar un torneo por fila.
//
//  Va APARTE de bajar la página, y a propósito: son dos cosas
//  distintas —una escribe en la base, la otra te da un fichero— y
//  juntarlas significaría que no se puede rehacer un calendario sin
//  volver a bajarlo, ni bajarlo sin volver a registrarlo.
// ══════════════════════════════════════════════════════════════
var SB_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';

function rpcC(nombre, args){
  return fetch(SB_URL + '/rest/v1/rpc/' + nombre, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
               'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  }).then(function(r){ if (!r.ok) throw new Error('rpc'); return r.json(); });
}

/* El código vive sólo en esta pestaña, como en las páginas de
   torneo: en una computadora prestada no se queda abierto. */
function codigoGuardado(){
  try { return sessionStorage.getItem('bw-code') || '' } catch (e){ return '' }
}

function registrar(){
  if (!RESULT) return;

  var caja = document.getElementById('regMsg');
  var dicho = function(t, malo){
    caja.textContent = t;
    caja.style.color = malo ? '#A8323F' : '#0B7A5A';
  };

  var code = (document.getElementById('regCode').value || '').trim()
             || codigoGuardado();
  if (!code) return dicho(T('ponCodigo'), true);

  var slug = RESULT.tourney.name.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'torneo';

  dicho('…');
  rpcC('bw_register_tournament', {
    p_code: code,
    p_id: slug,
    p_nombre: RESULT.tourney.name,
    p_pueblo: RESULT.tourney.where,
    p_prefijo: RESULT.prefix,
    p_juegos: RESULT.games,
    p_deporte: DEPORTE
  }).then(function(r){
    if (!r || !r.ok){
      if (r && r.reason === 'code') return dicho(T('codigoMal'), true);
      /* Un código de mesa es válido y aun así no monta calendarios.
         Decir «código incorrecto» mandaría a buscar otro código que
         no existe; lo que falta es el permiso, no el código. */
      if (r && r.reason === 'build')
        return dicho(T('sinPermiso'), true);
      /* El nombre decide el id, así que dos torneos que se llamen
         igual escriben en el mismo sitio — y registrar reemplaza el
         calendario entero. Se niega y se dice de quién es, porque lo
         que hay que hacer es ponerle otro nombre a éste. */
      if (r && r.reason === 'ajeno')
        return dicho(T('ajeno', { D: r.dueno || T('otraPersona') }), true);
      if (r && r.reason === 'faltan-datos') return dicho(T('faltanDatos'), true);
      return dicho(T('noRegistro'), true);
    }

    try { sessionStorage.setItem('bw-code', code) } catch (e){}

    /* EL CHOQUE DE PREFIJOS SE DICE AQUÍ Y NO EN NINGÚN OTRO SITIO.
       Dos torneos cuyas iniciales coinciden —«Copa Loíza» y «Copa
       Lajas», los dos CL— tendrían juegos con el mismo número, y los
       marcadores se guardan por número: el segundo nacería con los
       del primero encima.

       Éste es el único momento en que arreglarlo es barato, porque
       quien está delante es quien le puso el nombre y puede
       cambiárselo ahora mismo. Después hay que tocar la base. */
    if (r.choque){
      /* El choque sí deja bajar: el torneo quedó registrado y la
         página es foto fiel de lo que hay en la base. Lo que avisa es
         que los números chocan con otro torneo, y eso se arregla
         cambiándole el nombre y volviendo a generar — pero la
         decisión es suya, no nuestra. */
      permitirBajar();
      guardarEstilo(code, slug);
      mostrarEnlace(slug);
      dicho(T('choque', { N: r.juegos, P: RESULT.prefix, C: r.choque }), true);
      return;
    }
    permitirBajar();
    guardarEstilo(code, slug);
    mostrarEnlace(slug);
    dicho(T('publicado', { N: r.juegos }));
  }).catch(function(e){
    console.error(e);
    dicho(T('sinRed'), true);
  });
}

// ── arranque ────────────────────────────────────────────────
document.getElementById('tStart').innerHTML = hours();
document.getElementById('tEnd').innerHTML = hours();

// Hasta ocho canchas. Arranca en una, que es lo que tiene un coach
// con su propio gimnasio; subirlo es un clic.
(function(){
  var sel = document.getElementById('tCourtN'), o = '';
  for (var i = 1; i <= 8; i++) o += '<option value="' + i + '">' + i + '</option>';
  sel.innerHTML = o;
  sel.value = 1;
  drawCourts();
})();

// Una categoría en blanco, para que haya dónde escribir sin tener que
// borrar nada primero.
addDiv();

/* ══ LO QUE TRAE EL ENTRENADOR EN EL ENLACE ════════════════════
   Desde su página de Cada Punto se llega aquí con tres cosas ya
   resueltas, y cada una quita un paso donde antes se perdía gente:

     modo=temporada → abre en la lista, no en el cuadro. Al que viene
       a subir sus seis juegos no se le pide prefijo ni siembras.
     code=… → su código, que si no tendría que ir a buscar otra vez.
       Se guarda donde el formulario de registrar ya lo busca.
     equipo=… → el nombre CON EL QUE SE INSCRIBIÓ. Es el que engancha
       sus juegos con su campaña, y escribirlo distinto —«Canovanas»
       donde puso «Canóvanas»— le deja un calendario sin botón de
       prometer y sin un error que se lo explique. Escrito por la
       máquina no se equivoca.

   Nada de esto es obligatorio: sin enlace, la página es la de
   siempre. */
(function(){
  var q = new URLSearchParams(location.search);

  var c = (q.get('code') || '').trim();
  if (c) { try { sessionStorage.setItem('bw-code', c) } catch(e){} }

  var eq = (q.get('equipo') || '').trim();
  if (eq) {
    var t = document.getElementById('sTeam');
    if (t) t.value = eq;
  }

  // Primero el idioma, que decide lo que dicen el resto de las
  // piezas; después el deporte, y después el modo, que pinta el
  // título y la entradilla que toquen. Va aquí, al final, cuando ya
  // existe todo lo que toca.
  pintarEstatico();
  deporte(q.get('deporte') === 'voleibol' ? 'voleibol' : 'baloncesto');
  modo(q.get('modo') === 'temporada' ? 'temporada' : 'torneo');
})();
</script>
