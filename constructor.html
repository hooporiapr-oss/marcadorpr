.wrap{width:min(900px,94vw);margin:0 auto}

header{flex:0 0 auto;background:#12202E;border-bottom:3px solid var(--ball);
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
/* Se ve. Era un texto gris al 85% y se perdía contra el azul de la
   cabecera; ahora es un botón con su borde y su fondo. */
.volver{padding:0 0 12px}
.volver a{display:inline-block;background:var(--ball);color:#12202E;
  font-size:.9rem;font-weight:900;text-decoration:none;
  padding:9px 16px;border-radius:999px;line-height:1}
.volver a:hover{filter:brightness(1.08)}
.volver a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.mark{font-weight:900;font-size:1.05rem;color:#fff;line-height:1.1}
.mark span{display:block;font-size:.58rem;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ball)}
.by{font-size:.95rem;font-weight:900;letter-spacing:-.02em;color:#fff;text-align:right}
.by span{color:var(--ball)}

.tools{background:#0B1724;padding:9px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools .wrap{display:flex;gap:6px;flex-wrap:nowrap}
.chip{white-space:nowrap;border:1px solid #33465A;background:none;color:#C8D6E2;
  border-radius:999px;padding:5px 12px;font:inherit;font-size:.7rem;font-weight:800;cursor:pointer}
.chip.on{background:var(--k,#fff);border-color:var(--k,#fff);color:#fff}
.chip.all.on{background:#fff;border-color:#fff;color:#0B1724}

main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
main .wrap{padding:clamp(16px,3vw,26px) 0 30px}

h1{font-size:clamp(1.4rem,4vw,1.9rem);letter-spacing:-.03em;margin:0 0 4px;font-weight:900}
.lede{color:var(--mute);margin:0 0 6px}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 20px;color:var(--mute);font-size:.86rem}
.stat b{color:var(--ink)}

/* Tabla de posiciones. Números tabulares para que las columnas
   no bailen, y el equipo con todo el ancho que sobre: en celular
   un nombre largo tiene que bajar de línea, no cortar la tabla. */
.tb{margin:0 0 26px}
.tb h2{font-size:1.02rem;font-weight:900;letter-spacing:-.02em;margin:0 0 8px;
  padding-bottom:6px;border-bottom:2px solid var(--ink)}
.tb h2 span{float:right;font-size:.7rem;font-weight:800;color:var(--mute);
  letter-spacing:.1em;text-transform:uppercase;padding-top:4px}
.tb .warn{margin:0 0 8px;color:var(--mute);font-size:.78rem}
.tb table{width:100%;border-collapse:collapse;font-size:.86rem}
.tb th{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);text-align:right;padding:0 0 5px 12px;white-space:nowrap}
.tb th.n,.tb th.e{text-align:left}
.tb td{padding:7px 0 7px 12px;border-top:1px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tb td.n{width:1.4rem;padding-left:0;text-align:left;color:var(--mute);
  font-size:.78rem;font-weight:800}
.tb td.e{text-align:left;font-weight:800;width:100%;white-space:normal;
  padding-left:4px;line-height:1.25}
.tb td.g{font-weight:900}
.tb tr.hide,.tb.hide{display:none}
@media(max-width:420px){.tb table{font-size:.8rem}
  .tb td{padding:6px 0 6px 9px}.tb th{padding-left:9px}.tb td.n{padding-left:0}}

/* ── Pestañas por categoría ───────────────────────────────
   Van en el cuerpo y no en la barra oscura de arriba: ahí
   parecían decoración del encabezado. Aquí se leen como lo
   que son, el mando del calendario que tienen debajo. */
.tabs{display:flex;gap:2px;margin:0 0 20px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  border-bottom:2px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs:empty{display:none}
.tab{flex:0 0 auto;white-space:nowrap;border:0;background:none;cursor:pointer;
  font:inherit;font-size:.85rem;font-weight:800;color:var(--mute);
  padding:10px 14px;margin-bottom:-2px;
  border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--k,var(--ink))}
@media(max-width:560px){
  .tab{font-size:.8rem;padding:9px 11px}
  /* En el teléfono las pestañas no caben y se corren de lado. El
     desvanecido de la derecha es lo que dice que hay más: sin él,
     la categoría que queda fuera no la encuentra nadie. */
  .tabs{mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
}

.day{margin-bottom:26px}
.day h2{font-size:1.02rem;font-weight:900;letter-spacing:-.02em;margin:0 0 8px;
  padding-bottom:6px;border-bottom:2px solid var(--ink)}
.day h2 span{float:right;font-size:.7rem;font-weight:800;color:var(--mute);
  letter-spacing:.1em;text-transform:uppercase;padding-top:4px}
.rows{display:grid;gap:4px}
/* Flex en vez de rejilla: con una rejilla de cinco columnas fijas, una
   categoría larga como "Juvenil Masculino" se salía del borde en vez
   de bajar de línea. Así cada pieza se acomoda sola. */
.r{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;
  padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:.88rem}
.r.p{border-color:var(--ball);background:rgba(255,122,24,.06)}
.r .t{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 58px}
.r .c{color:var(--mute);font-size:.78rem;font-weight:800;flex:0 0 32px}
.r .m{flex:1 1 180px;min-width:0}
.r .m b{font-weight:800}
.r .m i{font-style:normal;color:var(--mute);font-size:.8rem;padding:0 3px}
.r .j{color:var(--mute);font-size:.72rem;font-variant-numeric:tabular-nums;flex:0 0 auto}
.r .k{font-size:.58rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:var(--k);border-radius:3px;padding:3px 8px;white-space:nowrap;
  flex-shrink:0}
.r.hide{display:none}
.r .pls{flex:1 1 100%;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.r .pls:empty{display:none}
.pl{display:inline-block;border:1px solid var(--accent);border-radius:999px;
  padding:4px 11px;font-size:.74rem;font-weight:800;color:var(--accent);
  text-decoration:none;background:#fff}
.pl b{font-weight:900}
.pl:hover{background:var(--accent);color:#fff}
.pl.mine{border-color:var(--ink);color:var(--ink);background:#fff}
.pl.mine:hover{background:var(--ink);color:#fff}
.pl.want{border-style:dashed;border-color:var(--line);color:var(--mute);
  font-family:inherit;cursor:pointer}
.pl.want:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.pl.waiting{border-style:dashed;border-color:var(--line);color:#9AA8B5;cursor:default}

/* Un juego con marcador ya no admite promesas. El botón se queda a la
   vista, apagado y con el aviso: quitarlo dejaba la fila sin decir por
   qué había desaparecido. */
.pl.closed{border-style:dashed;border-color:#C3D2DD;color:#9AA8B5;background:var(--tint);
  cursor:default}
.pl.closed:hover{background:var(--tint);color:#9AA8B5}

/* La hoja de promesa: prometer, o mandársela a quien va a prometer. */
a.su-go{text-align:center;text-decoration:none}
.su-go.line{background:#fff;color:var(--ink);margin-top:10px}
.ps-game{border:2px solid var(--line);border-radius:4px;padding:12px 14px;margin:14px 0 2px;
  font-size:.95rem;line-height:1.45}
.ps-game b{font-weight:900}
.ps-game span{display:block;color:var(--mute);font-size:.8rem;margin-top:3px;
  font-variant-numeric:tabular-nums}
.ps-note{color:var(--mute);font-size:.8rem;margin:14px 0 0;text-align:center;line-height:1.5}
.ps-note b{color:var(--ink)}

/* El formulario, encima de la página: el mismo que en Cada Punto, sin
   mandar a nadie a otro sitio en medio de mirar el calendario. */
body.locked{overflow:hidden}
#signupBox{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;
  background:rgba(11,23,36,.72);padding:18px 0 40px}
#signupBox.on{display:block}
.su-card{position:relative;width:min(460px,92vw);margin:24px auto;background:#fff;
  border-radius:6px;padding:24px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.su-x{position:absolute;top:10px;right:12px;border:none;background:none;font-size:1.6rem;
  line-height:1;color:var(--mute);cursor:pointer;padding:4px 8px}
.su-kick{font-size:.62rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.su-h{font-size:1.35rem;font-weight:900;letter-spacing:-.03em;margin:4px 0 6px}
.su-p{color:var(--mute);font-size:.92rem;margin:0 0 6px}
.su-card label{display:block;font-size:.8rem;font-weight:700;margin:13px 0 4px}
.su-card input[type=text],.su-card input[type=email],.su-card input[type=tel]{
  width:100%;padding:12px;border:2px solid var(--ink);border-radius:4px;
  font:inherit;font-size:1rem;color:var(--ink);background:#fff}
.su-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(12,110,140,.15)}
.su-ok{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:.85rem;color:var(--mute)}
.su-ok input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.su-ok span{cursor:pointer}
.su-ok a{color:var(--accent)}
.su-go{display:block;width:100%;margin-top:16px;padding:15px;border:2px solid var(--ink);
  border-radius:4px;background:var(--ink);color:#fff;font:inherit;font-weight:800;
  font-size:1rem;cursor:pointer}
.su-msg{min-height:1.2em;margin:10px 0 0;font-weight:700;font-size:.9rem;text-align:center}
.su-msg.bad{color:#A8323F}
.su-fee{color:var(--mute);font-size:.82rem;margin:12px 0 0}
.su-done{text-align:center;padding:10px 0}
.su-tick{font-size:2.6rem;line-height:1;margin-bottom:6px}
.pl.waiting:hover{background:#fff;color:#9AA8B5}
.r{cursor:default}
.r.done{background:var(--tint)}
.r.done.p{background:rgba(255,122,24,.1)}
.r .sc{display:block;font-size:.8rem;font-weight:900;color:var(--mute);
  font-variant-numeric:tabular-nums;margin-top:1px}
.r .sc b{color:var(--ink)}
.r .m b.fill{color:#0C6E8C}
.r .won{color:#0B7A5A;font-weight:900}
.r .won::after{content:' ✓';font-size:.8em}
.r .lost{color:#9AA8B5;font-weight:500}

/* el marcador: el que ganó, grande y oscuro; el otro, apagado */
.r .sc{display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.r .sc .hi{font-size:1.05rem;font-weight:900;color:var(--ink)}
.r .sc .lo{font-size:.9rem;font-weight:700;color:#9AA8B5}
.r .sc .d{padding:0 5px;color:#C3D2DD;font-weight:700}
.r .sc b{font-size:1rem;font-weight:800}

/* y la fila entera se nota jugada */
.r.done{background:var(--tint);border-color:#C3D2DD}
.r.done.p{background:rgba(255,122,24,.1);border-color:var(--ball)}
.r.live{cursor:pointer}

/* Las casillas, dentro de la fila */
.ed{flex:1 1 100%;display:flex;gap:6px;align-items:center;margin-top:6px}
.ed.saving{opacity:.5;pointer-events:none}
.ep{width:58px;padding:9px 6px;border:2px solid var(--ink);border-radius:4px;
  font:inherit;font-size:1.05rem;font-weight:800;text-align:center;color:var(--ink);
  background:#fff;font-variant-numeric:tabular-nums}
.ep:focus{outline:none;border-color:var(--ball);box-shadow:0 0 0 3px rgba(255,122,24,.2)}
.ep::placeholder{font-size:.68rem;font-weight:700;color:#9AA8B5}
.edash{color:var(--mute);font-weight:800}
.esave,.edel{padding:9px 14px;border:2px solid var(--ink);border-radius:4px;
  background:var(--ink);color:#fff;font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}
.edel{background:#fff;color:var(--bad,#A8323F);border-color:var(--line)}
.eclose{margin-left:auto;padding:7px 12px;border:1px solid var(--line);border-radius:4px;
  background:#fff;color:var(--mute);font:inherit;font-size:1.1rem;line-height:1;cursor:pointer}
.eclose:hover{border-color:var(--ink);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:70;
  background:#0B1724;color:#fff;padding:11px 16px;border-radius:999px;font-size:.84rem;
  font-weight:700;max-width:88vw;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:opacity .4s}
.toast.go{opacity:0}
.r.live:hover{border-color:var(--ink)}

/* la barra de abajo, sólo cuando está desbloqueado */
.lock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0B1724;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:none}
.lock.on{display:block}
.lock .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lock span{color:#9FB3C4;font-size:.76rem;font-weight:800}
.lock button{border:1px solid #33465A;background:none;color:#C8D6E2;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}
@media(max-width:620px){
  .r .t{flex:0 0 52px}
  .r .c{flex:0 0 28px;font-size:.72rem}
  .r .m{flex:1 1 100%}
  .r .j{font-size:.68rem}
}

/* Cada Punto. En un torneo generado esta tarjeta es lo único que le
   explica el programa a un papá que llegó buscando la hora del juego
   de su hijo. Sin ella, "prometer" es una palabra suelta al lado de
   un nombre y nadie le da. */
.cpad{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  text-decoration:none;color:#fff;background:#12202E;border:3px solid var(--ball);
  border-radius:6px;padding:20px 22px;margin:26px 0 28px}
.cpad:hover{background:#0B1724;box-shadow:0 0 0 4px rgba(255,122,24,.18)}
.cpad-l{flex:1 1 300px;min-width:0}
.cpad-h{display:block;font-size:1.05rem;font-weight:900;letter-spacing:-.02em;margin-bottom:3px}
.cpad-p{display:block;color:#B9CBD9;font-size:.9rem;line-height:1.55}
.cpad-r{flex:0 0 auto;text-align:center}
.cpad-mk{display:block;font-weight:900;font-size:.95rem;letter-spacing:-.01em}
.cpad-mk em{font-style:normal;color:#FF8A2B}
.cpad-mk i{font-style:normal;color:#6FD83C}
.cpad-go{display:inline-block;margin-top:8px;padding:9px 16px;border:2px solid var(--ball);
  border-radius:4px;color:var(--ball);font-weight:800;font-size:.86rem}
.cpad:hover .cpad-go{background:var(--ball);color:#1A0C00}
@media(max-width:620px){
  .cpad{padding:17px;margin:22px 0 24px}
  .cpad-r{flex:1 1 100%;text-align:center}
  .cpad-go{display:block;text-align:center}
}

/* El gimnasio. Misma tarjeta que la de Cada Punto, en verde agua en
   vez de naranja, y va DEBAJO de ella.

   Está aquí porque un calendario se visita una vez: se mira la hora
   del juego y se cierra. Esto es lo único de la página que da una
   razón para volver el día que no hay juego, y es gratis, así que no
   le pide nada a nadie para enseñar lo que hace.

   Sin equipo en la cola: quien llega desde un calendario no es de
   ningún programa todavía, así que entra por la puerta de la calle
   igual que desde la portada de Cada Punto. */
.gym{--ball:#00D9A5}
.gym .cpad-mk em,.gym .cpad-mk i{color:#00D9A5}
.gym:hover{box-shadow:0 0 0 4px rgba(0,217,165,.18)}
.gym .cpad-go{color:#00D9A5;border-color:#00D9A5}
.gym:hover .cpad-go{background:#00D9A5;color:#04201A}

.courts{display:grid;gap:6px;margin:0 0 22px;font-size:.84rem;color:var(--mute)}
.courts b{color:var(--ink)}

/* Local y visitante. Van FUERA de .sa/.sb a propósito: paint() les
   reescribe el textContent cada vez que bajan marcadores, y una
   etiqueta metida dentro se borraría sola al primer marcador. */
.ha{display:inline-block;font-style:normal;font-size:.56rem;font-weight:900;
  letter-spacing:.06em;vertical-align:.14em;margin-right:5px;padding:2px 5px;
  border-radius:3px;background:var(--ink);color:#fff}
.ha.a{background:none;color:var(--mute);border:1px solid var(--line);padding:1px 4px}
.ha-leg{margin-top:4px;font-size:.78rem;color:var(--mute)}

footer{flex:0 0 auto;background:#12202E;color:#9FB3C4;border-top:1px solid #0B1724;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.8rem}
footer b{color:#fff;display:block;font-weight:800}
footer a{color:#4FD3F0;text-decoration:none}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="mark"><span>__KICKER__</span>__NAME__</div>
    <div class="by">marcador<span>pr</span></div>
  </div>
  <!-- VOLVER. A este calendario se llega desde fuera —desde la
       portada de Cada Punto, desde un enlace de WhatsApp— y no había
       manera de salir salvo el botón del navegador. En un móvil, con
       el calendario abierto a pantalla completa, eso es un callejón.

       Va a un destino fijo y no a history.back(): quien llega por un
       enlace compartido no tiene a dónde volver, y así hace lo mismo
       para todo el mundo.

       Y lleva a Cada Punto Cuenta, no a la portada de marcadorpr: el
       calendario es la prueba, y de ahí se sale a lo que se está
       vendiendo. -->
  <div class="wrap volver">
    <a href="https://cadapunto.com/">&larr; Cada Punto Cuenta</a>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="stat" id="stat"></div>

    <div class="courts" id="courts"></div>

    <!-- El mismo botón que la portada de marcadorpr, al mismo sitio:
         la portada de Cada Punto, que desde hoy cuenta los tres pasos
         y el precio. Conserva ?t= para saber de qué torneo vino. -->
    <a class="cpad" href="https://cadapunto.com/?t=__SLUG__">
      <span class="cpad-l">
        <b class="cpad-h">¿Tu equipo recauda con sus juegos?</b>
        <!-- Aquí decía que al padrino le llega «el enlace para pagarle al programa
             directo». La divulgación dice lo contrario: «un aviso, y nada más: sin
             enlace de pago y sin recordatorios». Esta tarjeta sale en cada calendario
             que genera el constructor, así que prometía un enlace que no existe. -->
        <span class="cpad-p">Los padrinos prometen unos centavos por cada punto que anota tu
          equipo. Al cerrar el juego les llega un aviso con el marcador final y lo que dio su
          promesa — sin enlace de pago y sin recordatorios: el pago es entre ellos y tu
          programa, sin que el dinero pase por nadie más. Ganen o pierdan, el programa
          gana.</span>
      </span>
      <span class="cpad-r">
        <span class="cpad-mk">cada <em>punto</em> <i>cuenta</i></span>
        <span class="cpad-go">Ver cómo funciona →</span>
      </span>
    </a>


<div class="tabs" id="tabs" role="tablist"></div>

<div id="tabla"></div>
<div id="days"></div>

<!-- EL GIMNASIO VA AQUÍ ABAJO Y NO ARRIBA, y la diferencia importa.

     Arriba estuvo un minuto y se quitó: con las dos tarjetas antes
     del calendario, un papá que abre esto para ver a qué hora juega
     su hijo tiene que pasar por delante de las dos para llegar a lo
     que vino a buscar. La de Cada Punto se queda arriba porque es la
     que le explica el programa al que no sabe qué es esto; ésta no
     explica nada que haga falta para leer un calendario.

     Y además aquí funciona mejor: ya encontró la hora. Es el momento
     en que se puede ofrecer algo para volver el día que no hay
     juego, que es lo único de esta página que da una razón de
     volver. -->
<a class="cpad gym" href="https://hooporia.mobi/fortress-mobile-hub.html?e=demo">
  <span class="cpad-l">
    <b class="cpad-h">Cuatro minutos, y gratis</b>
    <span class="cpad-p">Cuatro estaciones que entrenan memoria, reconocimiento y reacción —
      lo que un jugador usa antes de tocar el balón. Se juega desde el teléfono, no hay que
      inscribirse y no cuesta nada. El tablero guarda lo que va subiendo.</span>
  </span>
  <span class="cpad-r">
    <span class="cpad-mk">cognitivo <em>gym</em></span>
    <span class="cpad-go">Entrar →</span>
  </span>
</a>
  </div>
</main>

<div id="signupBox"></div>

<div class="lock" id="lock">
  <div class="wrap">
    <span id="lockWho">Marcadores desbloqueados</span>
    <button onclick="lockOff()">Bloquear</button>
  </div>
</div>

<footer>
  <b>© 2026 Gostar Digital LLC · Puerto Rico</b>
  Marcadores en vivo · Las promesas se hacen en
  <a href="https://cadapunto.com">Cada Punto</a>
</footer>

<script>
// ══ DATOS DEL TORNEO ══════════════════════════════════
// Generados por el constructor de calendarios. Cambia aquí

function pledgeBits(row){
  var out = [];
  var mine = [];                       // un "soy jugador" por equipo
  var sides = [row.dataset.a, row.dataset.b];

  sides.forEach(function(side, i){
    var real = resolve(side);
    // Un hueco del cuadro no es un equipo. placeholderFor sólo conoce
    // "Ganador DB-9"; los de grupo — "1º Grupo A", "2º" — se colaban y
    // salían ofreciendo campaña para un equipo que no existe.
    if (/^(Ganador|\d+º)/.test(real)) return;
    var t = TEAMS[teamKey(real)];

    if (!t){
      // Sin campaña: se ofrece pedirla una sola vez, en su primer juego.
      var clave = teamKey(real);
      if (PEDIDOS[clave]) return;
      PEDIDOS[clave] = 1;

      if (ASKED[real.toLowerCase()]){
        out.push('<span class="pl waiting"><b>' + real + '</b>' + ASK.waiting + '</span>');
      } else {
        out.push('<button class="pl want" onclick="askTeam(\'' +
                   real.replace(/'/g, "\\'") + '\')">' +
                   '<b>' + real + '</b>' + ASK.want +
                 '</button>');
      }
      return;
    }

    // Para ese equipo, el rival es el otro lado — que es como está
    // puesto el juego en su propia campaña.
    var foe = resolve(sides[i === 0 ? 1 : 0]);

    // El botón no se va a Cada Punto: abre la hoja aquí mismo. Los
    // datos del juego se guardan en un registro y el onclick lleva
    // sólo una clave — un nombre de equipo con apóstrofo rompía el
    // onclick entero.
    // SIN LLAVE NO HAY BOTÓN DE PROMETER.
    //
    // Un equipo puede tener campaña y que su juego todavía no esté
    // enlazado —se inscribió después de registrarse el torneo, y nadie
    // ha vuelto a enlazar—. Antes el botón salía igual y mandaba a una
    // página que intentaba adivinar el juego por fecha y rival. Ahora
    // se ofrece lo mismo que a un equipo sin campaña: la información
    // de cómo recaudar. Es la verdad —todavía no hay juego al que
    // enganchar una promesa— y no manda a nadie a un callejón.
    var llave = (i === 0 ? row.dataset.ga : row.dataset.gb) || '';

    /* Y SIN PADRINOS TAMPOCO HAY BOT\u00d3N, aunque haya llave.
       El entrenador dijo que en este juego no recauda: ofrecerle
       prometer a alguien lo manda a una p\u00e1gina que le contesta que
       ah\u00ed no hay padrinos. No se le ofrece nada en su sitio porque
       no falta nada — el juego est\u00e1 completo as\u00ed, con su marcador
       y sin promesas. */
    var rec = (i === 0 ? row.dataset.reca : row.dataset.recb) !== '0';
    if (llave && !rec) return;

    if (!llave){
      var kSin = teamKey(real);
      if (PEDIDOS[kSin]) return;
      PEDIDOS[kSin] = 1;
      out.push('<button class="pl want" onclick="askTeam(\'' +
                 real.replace(/'/g, "\\'") + '\')">' +
                 '<b>' + real + '</b>' + ASK.want +
               '</button>');
      return;
    }

    var clave = 'p' + (++PKEY);
    PLEDGEABLE[clave] = {
      team: real, campaign: t.campaign, foe: foe, game: llave,
      on: row.dataset.on || '', j: row.dataset.j || '',
      court: row.dataset.court || '',
      time: (row.querySelector('.t') || {}).textContent || ''
    };

    out.push('<button class="pl" onclick="event.stopPropagation();pledgeSheet(\'' +
               clave + '\')"><b>' + real + '</b>' + STR_PLEDGE +
             '</button>');

    // AQUÍ IBA «Soy jugador · mi enlace», a jugador.html.
    //
    // Esa página es del producto por alumno: cada jugador tenía su
    // propio enlace y sus padrinos prometían por SUS puntos. En el
    // modelo por juego no existe tal cosa — se promete por los puntos
    // del EQUIPO, y el enlace del juego es el mismo para todos. El
    // botón seguía ahí, en la misma fila que el de prometer, llevando
    // a un callejón: lo que ofrecía ya no se puede hacer.
  });
  return out.join('');
}

// Un juego ya jugado: el botón de cada equipo con campaña se queda
// puesto y apagado. Prometer sobre un marcador que ya se sabe no es
// prometer, y borrar el botón no explicaba nada.
function closedBits(row){
  var out = [];
  [row.dataset.a, row.dataset.b].forEach(function(side){
    var real = resolve(side);
    if (/^(Ganador|\d+º)/.test(real)) return;
    if (!TEAMS[teamKey(real)]) return;          // sin campaña no había nada que cerrar
    out.push('<span class="pl closed"><b>' + real + '</b>' + STR_CLOSED + '</span>');
  });
  return out.join('');
}

function sharePledge(clave){
  var d = PLEDGEABLE[clave];
  if (!d) return;

  var url = pledgeURL(d);
  var texto = d.team + ' vs ' + d.foe + ' — ' + d.j +
              '. Promete unos centavos por cada punto que anote ' + d.team + ':';

  // En el teléfono, el compartir del sistema: WhatsApp está ahí y es
  // por donde se recoge.
  if (navigator.share){
    navigator.share({ title: d.team, text: texto, url: url }).catch(function(){});
    return;
  }

  // En computadora no hay compartir: al portapapeles, y si tampoco se
  // puede, el enlace a la vista para copiarlo a mano.
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(function(){ suSay(PS.copied); }, function(){ suSay(url); });
  } else {
    suSay(url);
  }
}

// ══════════════════════════════════════════════════════
//  "Ganador J-9" deja de ser un hueco en cuanto se pone
//  el marcador de J-9. Y como un ganador puede depender de
//  otro ganador, se resuelve hacia atrás hasta encontrar un
//  nombre de verdad.
// ══════════════════════════════════════════════════════
var BYNO = {};    // J-9 → { a:'CNSC Red', b:'DAC-A' }
// Ojo: NO llamarlo GAMES. Arriba ya existe var GAMES con el
// calendario entero, y una segunda declaración lo borraba: la
// página salía en blanco con sólo las canchas.

function indexGames(){
  // Desde los datos primero, no sólo desde el DOM.
  GAMES.forEach(function(g){ BYNO[norm(g.no)] = { a: g.a, b: g.b }; });

  var rows = document.querySelectorAll('.r');
  for (var i = 0; i < rows.length; i++){
    BYNO[norm(rows[i].dataset.j)] = { a: rows[i].dataset.a, b: rows[i].dataset.b };
  }
}

function norm(s){
  /* Sin acentos a propósito. Esto compara nombres de equipo contra los
     de Cada Punto, y los escribe gente distinta: el calendario lo teclea
     un coach y la campaña la escribió otro. «Canóvanas» y «Canovanas»
     tienen que ser el mismo equipo, o el botón de prometer no sale y
     nadie ve un error — la página ofrece inscribir a un equipo que ya
     recauda. Los números de juego son ASCII, así que esto no los toca. */
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/#/g, '').trim().toUpperCase();
}

function placeholderFor(name){
  // El prefijo ya no es siempre J: cada torneo trae el suyo.
  var m = norm(name).match(/^GANADOR\s+(\S+)$/);
  return m ? m[1] : null;
}

// Devuelve el nombre real si ya se sabe, o el texto original si no.
// El guardia de profundidad evita que dos juegos que se apunten el uno
// al otro cuelguen la página.
function resolve(name, depth){
  depth = depth || 0;
  if (depth > 8) return name;

  var key = placeholderFor(name);
  if (!key) return name;

  var g = BYNO[key], s = SCORES[key];
  if (!g || !s || s.a === s.b) return name;

  var winner = s.a > s.b ? g.a : g.b;
  return resolve(winner, depth + 1);
}



function paint(){
  var rows = document.querySelectorAll('.r');
  for (var i = 0; i < rows.length; i++){
    var r = rows[i];
    var s = SCORES[norm(r.dataset.j)] || SCORES[r.dataset.j];
    var sa = r.querySelector('.sa'), sb = r.querySelector('.sb'), sc = r.querySelector('.sc');

    // Los huecos del cuadro se rellenan solos según entran marcadores.
    var na = resolve(r.dataset.a), nb = resolve(r.dataset.b);
    sa.textContent = na;
    sb.textContent = nb;
    sa.classList.toggle('fill', na !== r.dataset.a);
    sb.classList.toggle('fill', nb !== r.dataset.b);

    r.classList.toggle('live', !!code());
    sa.className = 'sa'; sb.className = 'sb';

    if (!s){ r.classList.remove('done'); sc.textContent = ''; continue; }

    r.classList.add('done');

    if (s.a > s.b){
      sa.className = 'sa won'; sb.className = 'sb lost';
      sc.innerHTML = '<b class="hi">' + s.a + '</b><span class="d">–</span><b class="lo">' + s.b + '</b>';
    } else if (s.b > s.a){
      sb.className = 'sb won'; sa.className = 'sa lost';
      sc.innerHTML = '<b class="lo">' + s.a + '</b><span class="d">–</span><b class="hi">' + s.b + '</b>';
    } else {
      sc.innerHTML = '<b>' + s.a + '</b><span class="d">–</span><b>' + s.b + '</b>';
    }
  }
}

// ══════════════════════════════════════════════════════
//  TABLA DE POSICIONES
//  No guarda nada: se calcula entera cada vez, con las
//  filas que ya están en la página y los marcadores que
//  ya bajaron. Si no hay marcadores, no hay tabla.
// ══════════════════════════════════════════════════════

// El margen de cada juego se cuenta hasta aquí y no más. Sin
// tope, ganar por cuarenta sube en la tabla y además recauda
// más en Cada Punto — y no queremos publicar ese incentivo.
var DIF_CAP = 15;

// Lo que resuelve el cuadro no va a la tabla: ahí manda el bracket.
// Todo lo demás sí. Se excluye por lista conocida y no al revés: si
// mañana una liga marca sus juegos como "Jornada 3", la tabla tiene
// que contarlos, no borrarlos en silencio.
var BRACKET = /^(Final|Semifinal|Cuartos|Ronda\s)/i;

function tableBucket(stage){
  var s = String(stage || '').trim();
  if (BRACKET.test(s)) return null;               // null = no cuenta
  var m = s.match(/^Grupo\s+(\S+)/i);
  // Un grupo lleva su propia tabla. Lo demás — liga, jornada, nada —
  // cae en la tabla única de la categoría.
  return m ? 'Grupo ' + m[1].toUpperCase() : '';
}

function blankRow(name){
  return { name: name, pj: 0, g: 0, p: 0, pf: 0, pc: 0, dif: 0, h2h: [] };
}

// Devuelve [{ key, cat, group, teams:[...], jugados, total }]
function standings(){
  var pots = {};   // clave de tabla → { cat, group, teams, jugados, total }

  var rows = document.querySelectorAll('.r');
  for (var i = 0; i < rows.length; i++){
    var r = rows[i];
    var bucket = tableBucket(r.dataset.stage);
    if (bucket === null) continue;

    var cat = r.dataset.cat || '';
    var key = cat + (bucket ? ' · ' + bucket : '');
    var pot = pots[key] || (pots[key] = {
      key: key, cat: cat, group: bucket, teams: {}, jugados: 0, total: 0
    });

    // Los huecos del cuadro ya resueltos cuentan con su nombre real.
    var na = resolve(r.dataset.a), nb = resolve(r.dataset.b);
    if (placeholderFor(na) || placeholderFor(nb)) continue;  // aún sin dueño

    pot.total++;
    var ta = pot.teams[na] || (pot.teams[na] = blankRow(na));
    var tb = pot.teams[nb] || (pot.teams[nb] = blankRow(nb));

    var s = SCORES[norm(r.dataset.j)];
    if (!s || s.a == null || s.b == null) continue;

    pot.jugados++;
    var cap = function(d){ return Math.max(-DIF_CAP, Math.min(DIF_CAP, d)); };

    ta.pj++; tb.pj++;
    ta.pf += s.a; ta.pc += s.b;
    tb.pf += s.b; tb.pc += s.a;
    ta.dif += cap(s.a - s.b);
    tb.dif += cap(s.b - s.a);
    if (s.a > s.b){ ta.g++; tb.p++; }
    else if (s.b > s.a){ tb.g++; ta.p++; }

    // El margen se guarda ya con tope: la tabla chiquita del
    // desempate tiene que castigar la goleada igual que la grande.
    ta.h2h.push({ foe: nb, us: s.a, them: s.b, m: cap(s.a - s.b) });
    tb.h2h.push({ foe: na, us: s.b, them: s.a, m: cap(s.b - s.a) });
  }

  return Object.keys(pots).sort().map(function(k){
    var pot = pots[k];
    var list = Object.keys(pot.teams).map(function(n){ return pot.teams[n]; });
    return {
      key: pot.key, cat: pot.cat, group: pot.group,
      jugados: pot.jugados, total: pot.total,
      teams: rank(list)
    };
  });
}

// ── Desempate ────────────────────────────────────────
// 1. más ganados
// 2. entre los empatados nada más, quién le ganó a quién
// 3. diferencia con tope
// 4. puntos a favor
//
// El paso 2 se hace con una tabla chiquita, no mirando un
// solo juego: en un grupo de cuatro el empate normal no es
// de dos equipos, es de tres y en círculo — A le ganó a B,
// B a C, C a A. Buscando un solo resultado eso no se
// resuelve y la tabla parece estar mala. Con la tabla
// chiquita se resuelve casi siempre, y cuando de verdad es
// un círculo cae sola al paso 3.
function rank(list){
  var out = [];
  var byWins = list.slice().sort(function(x, y){ return y.g - x.g; });

  var i = 0;
  while (i < byWins.length){
    var j = i;
    while (j + 1 < byWins.length && byWins[j + 1].g === byWins[i].g) j++;
    var block = byWins.slice(i, j + 1);
    out = out.concat(block.length > 1 ? breakTie(block) : block);
    i = j + 1;
  }

  out.forEach(function(t, n){ t.pos = n + 1; });
  return out;
}

function breakTie(block){
  var inside = {};
  block.forEach(function(t){ inside[t.name] = true; });

  // La tabla chiquita sólo vale si todos los empatados jugaron
  // entre sí. En un grupo siempre es así. En una liga con calendario
  // desigual, no: comparar por un cruce que la mitad no jugó pone
  // por debajo a un equipo con mejor diferencia sin que nadie le
  // haya ganado. Si falta un cruce, se salta al paso 3.
  var todos = block.every(function(t){
    var jugo = {};
    t.h2h.forEach(function(x){ if (inside[x.foe]) jugo[x.foe] = 1; });
    return block.every(function(o){ return o === t || jugo[o.name]; });
  });

  // Tabla chiquita: sólo los juegos entre los empatados.
  block.forEach(function(t){
    t.mg = 0; t.mdif = 0;
    if (!todos) return;
    t.h2h.forEach(function(x){
      if (!inside[x.foe]) return;
      if (x.us > x.them) t.mg++;
      t.mdif += x.m;
    });
  });

  return block.slice().sort(function(x, y){
    return (y.mg - x.mg) || (y.mdif - x.mdif) ||
           (y.dif - x.dif) || (y.pf - x.pf) ||
           x.name.localeCompare(y.name);
  });
}

// Pintar las tablas. Mientras falten marcadores lo dice arriba
// de cada una: una tabla a medias tiene que leerse incompleta,
// no equivocada.
function paintTable(){
  var box = document.getElementById('tabla');
  if (!box) return;

  var tables = standings().filter(function(t){ return t.jugados > 0; });
  if (!tables.length){ box.innerHTML = ''; return; }

  box.innerHTML = tables.map(function(t){
    var falta = t.total - t.jugados;
    return '<section class="tb" data-cat="' + esc(t.cat) + '">' +
      '<h2>' + esc(t.key || 'Posiciones') +
        '<span>' + t.jugados + ' de ' + t.total + ' jugados</span></h2>' +
      (falta ? '<p class="warn">' +
               (falta === 1 ? 'Falta 1 marcador — la tabla cambia cuando entre.'
                            : 'Faltan ' + falta + ' marcadores — la tabla cambia cuando entren.') +
               '</p>' : '') +
      '<table><thead><tr><th class="n"></th><th class="e">Equipo</th>' +
        '<th>PJ</th><th>G</th><th>P</th><th>DIF</th><th>PF</th></tr></thead><tbody>' +
      t.teams.map(function(x){
        return '<tr><td class="n">' + x.pos + '</td>' +
          '<td class="e">' + esc(x.name) + '</td>' +
          '<td>' + x.pj + '</td>' +
          '<td class="g">' + x.g + '</td>' +
          '<td>' + x.p + '</td>' +
          '<td>' + (x.dif > 0 ? '+' + x.dif : x.dif) + '</td>' +
          '<td>' + x.pf + '</td></tr>';
      }).join('') +
      '</tbody></table></section>';
  }).join('');
}

function load(){
  Promise.all([ rpc('bw_board'), loadTeams(), loadAsked() ])
    .then(function(r){ SCORES = r[0] || {}; paint(); paintTable(); paintPledges(); })
    .catch(function(e){ console.error(e); });
}

// ══════════════════════════════════════════════════════
//  Poner un marcador sin salir de la fila: dos casillas y
//  guardar. Ochenta juegos en cinco días, de pie en un
//  gimnasio — cada toque de menos cuenta.
// ══════════════════════════════════════════════════════
function tap(row){
  if (!code()) return;                 // sin código no se toca nada
  if (row.querySelector('.ed')) return;   // ya está abierta

  var j = norm(row.dataset.j);
  var cur = SCORES[j];

  var ed = document.createElement('span');
  ed.className = 'ed';
  /* DOS CASILLAS, LOS DOS DEPORTES. El marcador final de un partido
     de voleibol son los puntos que anoto cada equipo, igual que en
     baloncesto: un numero por lado y el mayor gana. La mesa escribe
     lo mismo juegue lo que juegue. */
  ed.innerHTML =
    '<input class="ep" type="tel" inputmode="numeric" maxlength="3" ' +
      'value="' + (cur ? cur.a : '') + '" placeholder="' + esc(shortName(row.dataset.a)) + '">' +
    '<span class="edash">–</span>' +
    '<input class="ep" type="tel" inputmode="numeric" maxlength="3" ' +
      'value="' + (cur ? cur.b : '') + '" placeholder="' + esc(shortName(row.dataset.b)) + '">' +
    '<button class="esave">' + STR_SAVE + '</button>' +
    (cur ? '<button class="edel">' + STR_DEL + '</button>' : '') +
    '<button class="eclose" aria-label="cerrar">×</button>';

  row.appendChild(ed);

  var boxes = ed.querySelectorAll('.ep');

  // Evitar que tocar dentro vuelva a disparar la fila.
  ed.addEventListener('click', function(e){ e.stopPropagation(); });

  // Tres dígitos y salta sola a la otra; Enter guarda.
  boxes[0].addEventListener('input', function(){
    if (this.value.length >= 2 && Number(this.value) > 9) boxes[1].focus();
  });
  Array.prototype.forEach.call(boxes, function(b){
    b.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); save(); }
      if (e.key === 'Escape'){ e.preventDefault(); ed.remove(); }
    });
  });

  ed.querySelector('.esave').addEventListener('click', save);
  ed.querySelector('.eclose').addEventListener('click', function(){ ed.remove(); });
  var del = ed.querySelector('.edel');
  if (del) del.addEventListener('click', function(){
    rpc('bw_clear_score', { p_code: code(), p_game: j })
      .then(function(){ delete SCORES[j]; ed.remove(); paint(); paintTable(); paintPledges(); });
  });

  boxes[0].focus();
  boxes[0].select();

  function save(){
    var a = boxes[0].value.trim(), b = boxes[1].value.trim();
    if (!/^\d+$/.test(a) || !/^\d+$/.test(b)){
      boxes[!/^\d+$/.test(a) ? 0 : 1].focus();
      return;
    }

    ed.classList.add('saving');
    rpc('bw_set_score', {
      p_code: code(), p_game: j,
      p_a: parseInt(a, 10), p_b: parseInt(b, 10),
      p_team_a: resolve(row.dataset.a),
      p_team_b: resolve(row.dataset.b),
      p_on: row.dataset.on || null
    }).then(function(r){
      ed.classList.remove('saving');
      if (!r || !r.ok){
        if (r && r.reason === 'code'){ lockOff(); alert(STR_BADCODE); return; }
        alert(STR_FAIL);
        return;
      }
      SCORES[j] = { a: parseInt(a, 10), b: parseInt(b, 10) };
      ed.remove();
      paint(); paintTable(); paintPledges();
      if (r.pushed) toast(STR_PUSHED.replace('{O}', r.pushed));
    }).catch(function(e){
      ed.classList.remove('saving');
      console.error(e); alert(STR_FAIL);
    });
  }
}

// "Ganador J-9" no cabe de marcador de posición; el nombre corto sí.
function shortName(n){
  var r = resolve(n);
  if (placeholderFor(r)) return '?';
  return r.length > 9 ? r.slice(0, 9) : r;
}

// Un aviso que se va solo: un alert por juego, ochenta veces, es
// insoportable de pie en un gimnasio.
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.classList.add('go'); }, 2600);
  setTimeout(function(){ t.remove(); }, 3200);
}

// Desbloquear con doble toque en el escudo: no hace falta un botón
// que todo el mundo vea.
function unlock(){
  var c = prompt('Código de marcadores:');
  if (c === null) return;
  c = c.trim();
  if (!c) return;
  rpc('bw_check', { p_code: c }).then(function(ok){
    if (!ok){ alert('Código incorrecto.'); return; }
    keep(c);
    document.getElementById('lock').classList.add('on');
    paint();
  });
}

function lockOff(){
  try { sessionStorage.removeItem('bw-code'); } catch(e){}
  document.getElementById('lock').classList.remove('on');
  paint();
}

// El arranque va al final del script, después de que todo esté
// definido. Estaba aquí arriba y build() corría antes de que
// var DAYNAME tuviera valor: la página reventaba en el primer
// nombre de día.


// ══════════════════════════════════════════════════════
//  El calendario se pinta de los datos de arriba. Antes
//  estaban las ochenta filas escritas a mano, que es lo
//  que hacía falta un humano para montar un torneo.
// ══════════════════════════════════════════════════════
var DAYNAME = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function dayLabel(iso){
  var d = new Date(iso + 'T12:00:00');
  var m = d.toLocaleDateString('es-PR', { month:'long' });
  return DAYNAME[d.getDay()].charAt(0).toUpperCase() + DAYNAME[d.getDay()].slice(1) +
         ' ' + d.getDate() + ' de ' + m;
}

function mins(t){
  var h = parseInt(t, 10) % 12;
  if (/PM/i.test(t)) h += 12;
  return h * 60 + (parseInt(t.split(':')[1], 10) || 0);
}

function build(){
  // La cabecera, de los datos.
  var days = [], cats = [], courts = [], teams = {};
  GAMES.forEach(function(g){
    if (g.date && days.indexOf(g.date) === -1) days.push(g.date);
    if (g.cat && cats.indexOf(g.cat) === -1) cats.push(g.cat);
    if (g.court && courts.indexOf(g.court) === -1) courts.push(g.court);
    [g.a, g.b].forEach(function(t){
      if (t && !/^(Ganador|\d+º)/.test(t)) teams[t] = 1;
    });
  });
  days.sort(); courts.sort();

  document.getElementById('h1').textContent =
    'Los ' + GAMES.length + ' juegos' +
    // \w no cubre acentos: con "sábado" y "miércoles" el día se
    // quedaba pegado. \S+ corta la primera palabra sea cual sea.
    rango(days);

  // El mes se dice una sola vez si es el mismo: "del 21 al 22 de
  // noviembre", no "del 21 de noviembre al 22 de noviembre". Igual
  // que la descripción que va en WhatsApp, que ya lo hacía así.
  function rango(days){
    if (!days.length) return '';
    var a = dayLabel(days[0]).toLowerCase().replace(/^\S+\s/, '');
    var b = dayLabel(days[days.length - 1]).toLowerCase().replace(/^\S+\s/, '');
    if (days.length === 1) return ', el ' + a;
    var ma = a.replace(/^\d+\s+de\s+/, ''), mb = b.replace(/^\d+\s+de\s+/, '');
    if (ma === mb) return ', del ' + a.replace(/\s+de\s+.+$/, '') + ' al ' + b;
    return ', del ' + a + ' al ' + b;
  }

  document.getElementById('lede').textContent =
    courts.length + ' cancha' + (courts.length === 1 ? '' : 's') +
    (TOURNEY.where ? ' en ' + TOURNEY.where : '') + ', ' +
    cats.length + ' categoría' + (cats.length === 1 ? '' : 's') + ', ' +
    Object.keys(teams).length + ' equipos.';

  document.getElementById('stat').innerHTML =
    '<span><b>' + GAMES.length + '</b> juegos</span>' +
    '<span><b>' + cats.length + '</b> categorías</span>' +
    '<span><b>' + courts.length + '</b> canchas</span>' +
    '<span><b>' + days.length + '</b> días</span>';

  document.getElementById('courts').innerHTML =
    (TOURNEY.courts || []).map(function(c){
      return '<div><b>' + esc(c.id) + '</b> — ' + esc(c.name || c.id) + '</div>';
    }).join('') +
    '<div class="ha-leg"><em class="ha">H</em>local · <em class="ha a">A</em>visitante</div>';

  // Una pestaña por categoría, encima del calendario. Con una sola
  // categoría no hay nada entre qué escoger y la fila sobra.
  document.getElementById('tabs').innerHTML = cats.length < 2 ? '' :
    '<button class="tab on" role="tab" aria-selected="true" data-f="" ' +
      'onclick="filt(this)">Todo</button>' +
    cats.map(function(c){
      return '<button class="tab" role="tab" aria-selected="false" data-f="' + esc(c) + '" ' +
             'onclick="filt(this)" style="--k:' + (CATCOLOR[c] || '#12202E') + '">' +
             esc(c) + '</button>';
    }).join('');

  var html = '';
  days.forEach(function(d){
    var list = GAMES.filter(function(g){ return g.date === d; })
                    .sort(function(a, b){
                      var t = mins(a.time) - mins(b.time);
                      return t !== 0 ? t : String(a.court).localeCompare(String(b.court));
                    });
    if (!list.length) return;

    html += '<section class="day"><h2>' + dayLabel(d) +
            ' <span>' + list.length + ' juegos</span></h2><div class="rows">';

    list.forEach(function(g){
      /* EL EQUIPO DE CASA SE COMPARA SIN ACENTOS, igual que todo lo
         demás que compara nombres de equipo en esta página.

         Esto comparaba el texto crudo, y lo escriben dos veces: los
         equipos en su casilla y el equipo de casa en la suya. Teclear
         «Canóvanas» arriba y «Canovanas» abajo es lo normal —el
         primero que lo hizo fue el dueño del torneo— y el fallo no se
         veía como un fallo: cuando HOME no casa con ninguno de los
         dos, esto caía en ['H','A'] y le ponía la H al equipo que
         saliera primero. No es que faltara la marca; es que la página
         decía que era local un equipo que no lo era.

         norm() quita acentos, recorta y sube a mayúsculas, que es lo
         mismo que ya se usa para casar con las campañas de Cada
         Punto. Se mantiene el indexOf(...) === 0 y no una igualdad,
         porque «Canóvanas B» sigue siendo el equipo de casa. */
      var nh = norm(HOME);
      var esCasa = function(t){ return !!nh && norm(t).indexOf(nh) === 0; };
      var mine = esCasa(g.a) || esCasa(g.b);

      // Local y visitante sin escribir nada: manda el cuadro, salvo
      // que el equipo de casa del torneo esté abajo — en su pueblo es
      // local aunque el sorteo lo ponga de segundo.
      var ld = (esCasa(g.b) && !esCasa(g.a)) ? ['A','H'] : ['H','A'];
      html +=
        '<div class="r' + (mine ? ' p' : '') + '" data-cat="' + esc(g.cat) + '" ' +
          'data-court="' + esc(g.court) + '" data-j="' + esc(g.no) + '" ' +
          'data-on="' + esc(g.date) + '" data-a="' + esc(g.a) + '" data-b="' + esc(g.b) + '" ' +
          // La llave del juego que se promete, una por lado. Es lo que
          // lleva al padrino a SU juego sin que la otra punta tenga
          // que adivinarlo por fecha y nombre de rival.
          'data-ga="' + esc(g.ga || '') + '" data-gb="' + esc(g.gb || '') + '" ' +
          // Y si cada lado recauda, que decide si sale su bot\u00f3n de
          // prometer. Viene de torneo_publico en cada carga, as\u00ed que
          // apagarlo hoy lo apaga aqu\u00ed hoy.
          'data-reca="' + (g.reca === false ? '0' : '1') + '" ' +
          'data-recb="' + (g.recb === false ? '0' : '1') + '" ' +
          'data-stage="' + esc(g.stage || '') + '" ' +
          'onclick="tap(this)">' +
          '<span class="t">' + esc(g.time) + '</span>' +
          '<span class="c">' + esc(g.court) + '</span>' +
          '<span class="m">' +
            '<em class="ha' + (ld[0] === 'A' ? ' a' : '') + '">' + ld[0] + '</em>' +
            '<b class="sa">' + esc(g.a) + '</b> <i>vs</i> ' +
            '<em class="ha' + (ld[1] === 'A' ? ' a' : '') + '">' + ld[1] + '</em>' +
            '<b class="sb">' + esc(g.b) + '</b>' +
            '<span class="sc"></span></span>' +
          '<span class="pls"></span>' +
          '<span class="j">' + esc(g.no) + (g.stage ? ' · ' + esc(g.stage) : '') + '</span>' +
          '<span class="k" style="--k:' + (CATCOLOR[g.cat] || '#12202E') + '">' + esc(g.cat) + '</span>' +
        '</div>';
    });

    html += '</div></section>';
  });

  document.getElementById('days').innerHTML = html;
}

// Filtrar por categoría: la lista completa es larga, y una familia
// sólo quiere la suya.
function filt(btn){
  var want = btn.dataset.f || '';
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++){
    tabs[i].classList.remove('on');
    tabs[i].setAttribute('aria-selected', 'false');
  }
  btn.classList.add('on');
  btn.setAttribute('aria-selected', 'true');

  // Al cambiar de categoría se vuelve arriba: si venías del final de
  // una lista larga, la nueva empezaba a media página.
  var m = document.querySelector('main');
  if (m) m.scrollTop = 0;

  var rows = document.querySelectorAll('.r');
  for (var j = 0; j < rows.length; j++){
    var show = !want || rows[j].dataset.cat === want;
    rows[j].classList.toggle('hide', !show);
  }

  // Las tablas siguen al filtro igual que las filas.
  var tbs = document.querySelectorAll('.tb');
  for (var m = 0; m < tbs.length; m++){
    tbs[m].classList.toggle('hide', !!want && tbs[m].dataset.cat !== want);
  }

  // Un día sin juegos de esa categoría no hace falta enseñarlo.
  var days = document.querySelectorAll('.day');
  for (var k = 0; k < days.length; k++){
    var any = days[k].querySelectorAll('.r:not(.hide)').length;
    days[k].style.display = any ? '' : 'none';
  }
}

build();
indexGames();
document.querySelector('.mark').addEventListener('dblclick', unlock);
if (code()) document.getElementById('lock').classList.add('on');
load();
